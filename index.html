  }
  .banner-info-header-row{
    display:grid; grid-template-columns:1fr 70px 45px;
    font-size:.65rem; color:#666; font-weight:700; text-transform:uppercase;
    border-bottom:1px solid rgba(255,255,255,.07); padding-bottom:4px; margin-bottom:4px;
  }
  .banner-info-row{
    display:grid; grid-template-columns:1fr 70px 45px;
    font-size:.75rem; color:var(--text-dim); padding:2px 0;
  }
  .banner-info-rarity{ font-weight:700; }
  .banner-info-count{ color:#94a3b8; }
  .banner-info-rate{ color:#cbd5e1; font-weight:700; text-align:right; }
  .banner-info-total{
    margin-top:6px; padding-top:6px; border-top:1px solid rgba(255,255,255,.07);
    font-size:.72rem; color:#888; text-align:center;
  }
  .banner-card{
    position:relative; overflow:hidden;
    background:linear-gradient(160deg, var(--surface) 0%, #1F1608 100%);
    border:1px solid var(--border-soft); border-radius:var(--radius-lg);
    padding:16px;
  }
  .banner-card::before{
    content:''; position:absolute; top:-40%; right:-20%;
    width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle, rgba(232,85,122,.18), rgba(255,174,77,.15), transparent 70%);
    pointer-events:none;
  }
  .banner-header h3{
    font-family:var(--font-display); margin:0 0 4px; font-size:1.05rem;
  }
  .banner-header p{ margin:0 0 14px; font-size:.8rem; color:var(--text-dim); }
  .banner-actions{ display:flex; gap:10px; flex-wrap:wrap; position:relative; z-index:1; }
  .btn-gacha{
    flex:1 1 130px; border:none; border-radius:var(--radius);
    padding:11px 8px; cursor:pointer; text-align:center;
    font-family:var(--font-display); font-weight:700; font-size:.85rem;
    color:#fff; line-height:1.6;
    transition:transform .12s ease, box-shadow .2s ease;
    box-shadow:0 4px 16px -6px rgba(0,0,0,.5);
  }
  .btn-gacha:active{ transform:scale(.97); }
  .btn-gacha:hover{ box-shadow:0 6px 22px -6px rgba(0,0,0,.6); transform:translateY(-1px); }
  .btn-gacha small{ display:block; font-family:var(--font-mono); font-weight:700; font-size:.72rem; opacity:.8; }
  .btn-single{ background:linear-gradient(135deg, #FFC670, var(--accent2), #E8930F); color:#fff; }
  .btn-ten{ background:linear-gradient(135deg, var(--rose), var(--accent), #e8a040); color:#3B2000; }

  /* ============================================================
     CATALOGUE
     ============================================================ */
  .catalogue-progress{ margin-bottom:16px; }
  .progress-bar{
    height:8px; border-radius:4px; overflow:hidden; background:var(--surface-2);
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg, var(--accent2), var(--accent));
    transition:width .4s ease;
  }
  .progress-text{ font-size:.78rem; color:var(--text-dim); margin-top:6px; font-family:var(--font-mono); }
  .catalogue-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:8px;
  }
  .catalogue-entry{
    background:var(--surface); border:1px solid var(--border-soft);
    border-radius:var(--radius); padding:8px; text-align:center;
  }
  .catalogue-entry.unknown{ opacity:.45; }
  .catalogue-portrait{
    aspect-ratio:1/1; border-radius:var(--radius-sm); overflow:hidden;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:5px; font-family:var(--font-display); font-weight:700;
    font-size:1.3rem; color:var(--text-faint);
  }
  .catalogue-portrait img{ width:100%; height:100%; object-fit:cover; object-position:center 20%; }
  .unknown-silhouette{ color:var(--text-faint); font-family:var(--font-display); font-size:1.4rem; }
  .catalogue-name{ font-size:.7rem; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .catalogue-rarity{ font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-top:1px; filter:brightness(.6) saturate(1.3); }
  .catalogue-line-count{ font-size:.6rem; color:var(--text-dim); margin-top:3px; font-family:var(--font-mono); }
  .catalogue-entry{ cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; }
  .catalogue-entry:hover{ transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.4); }

  /* Modal lignée évolutive Catalogue */
  .modal-catalogue-line{ max-width:96vw; width:auto; }
  .catalogue-line-title{
    text-align:center; font-family:var(--font-display);
    margin-bottom:20px; font-size:1.1rem;
  }
  .catalogue-line-forms{
    display:flex; align-items:flex-start; justify-content:center;
    gap:0; flex-wrap:wrap;
  }
  .catalogue-line-arrow{
    font-size:2rem; color:var(--text-dim); align-self:center;
    padding:0 8px; flex-shrink:0;
  }
  .catalogue-line-form{
    display:flex; flex-direction:column; align-items:center;
    width:200px; flex-shrink:0;
  }
  .catalogue-line-form.unknown{ opacity:.45; }
  .catalogue-line-portrait{
    width:200px; height:250px;
    border-radius:var(--radius); overflow:hidden;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--border-soft);
    flex-shrink:0;
    position:relative;
  }
  /* Image brute, sans recadrage — toujours identique à l'URL du champ "Portrait" */
  .catalogue-line-portrait img{
    width:100%; height:100%; object-fit:cover; object-position:center 20%; display:block;
  }
  @media(min-width:900px){
    .catalogue-line-portrait{ width:270px; height:337px; }
    .catalogue-line-form{ width:270px; }
  }
  @media(min-width:1400px){
    .catalogue-line-portrait{ width:540px; height:675px; }
    .catalogue-line-form{ width:540px; }
  }
  .portrait-ph.large{ font-size:4rem; }
  .unknown-silhouette.large{ font-size:4rem; }
  .catalogue-line-info{
    margin-top:10px; text-align:center; width:100%; padding:0 8px;
  }
  .catalogue-line-name{ font-size:1rem; font-weight:800; font-family:var(--font-display); }
  .catalogue-line-rarity{ font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin:3px 0; filter:brightness(.6) saturate(1.3); }
  .catalogue-line-types{ display:flex; gap:4px; justify-content:center; flex-wrap:wrap; margin:4px 0; }
  .catalogue-line-desc{ font-size:.72rem; color:var(--text-dim); margin-top:6px; line-height:1.4; }
  .catalogue-line-evo-hint{ font-size:.7rem; color:var(--text-faint); margin-top:4px; }

  /* ============================================================
     GACHA — Animation flip
     ============================================================ */
  .gacha-result-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
    gap:12px; margin-top:16px;
  }
  /* Conteneur de la carte avec perspective 3D */
  .gacha-card-wrap{
    perspective:800px;
    cursor:default;
    position:relative;
  }
  /* Intérieur animé */
  .gacha-card-inner{
    position:relative;
    width:100%; padding-top:140%;   /* ratio portrait */
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.4,0,.2,1);
    border-radius:var(--radius);
  }
  .gacha-card-wrap.flipped .gacha-card-inner{
    transform:rotateY(180deg);
  }
  /* Dos et face partagent la même position */
  .gacha-card-back,
  .gacha-card-front{
    position:absolute; inset:0;
    border-radius:var(--radius);
    backface-visibility:hidden;
    overflow:hidden;
  }
  /* DOS — fond mystère velours */
  .gacha-card-back{
    background:linear-gradient(155deg, #190F06, #180F06, #0F0B06);
    border:2px solid rgba(232,85,122,.35);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px;
  }
  .gacha-card-back-glow{
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 40%, rgba(232,85,122,.22) 0%, rgba(139,92,246,.18) 50%, transparent 75%);
    animation:pulseGlow 2.2s ease-in-out infinite;
  }
  .gacha-card-back-icon{
    font-size:2.5rem; color:var(--champagne); position:relative; z-index:1;
    animation:spin 4s linear infinite;
    filter:drop-shadow(0 0 8px rgba(232,85,122,.6));
  }
  @keyframes pulseGlow{
    0%,100%{ opacity:.5; } 50%{ opacity:1; }
  }
  @keyframes spin{
    from{ transform:rotate(0deg); } to{ transform:rotate(360deg); }
  }
  /* FACE — contenu retourné */
  .gacha-card-front{
    transform:rotateY(180deg);
    background:var(--surface);
    border:2px solid var(--border-soft);
    display:flex; flex-direction:column;
  }
  /* Bordure colorée selon la rareté une fois retournée */
  .gacha-card-wrap.rarity-uncommon  .gacha-card-front{ border-color:#34D399; }
  .gacha-card-wrap.rarity-rare      .gacha-card-front{ border-color:#60A5FA; }
  .gacha-card-wrap.rarity-epic      .gacha-card-front{ border-color:#A78BFA; }
  .gacha-card-wrap.rarity-legendary .gacha-card-front{ border-color:#F59E0B; }
  .gacha-card-wrap.rarity-mythic    .gacha-card-front{ border-color:#F43F5E; }
  /* Shine pour les hautes raretés */
  .gacha-card-shine::after{
    content:'';
    position:absolute; inset:0; border-radius:var(--radius);
    background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);
    animation:shine .7s ease forwards;
    pointer-events:none; z-index:10;
  }
  @keyframes shine{
    from{ transform:translateX(-100%); }
    to{   transform:translateX(200%);  }
  }
  /* Portrait & infos dans la face */
  .gacha-card-front .gacha-portrait{
    flex:1; overflow:hidden;
  }
  .gacha-card-front .gacha-portrait img{
    width:100%; height:100%; object-fit:cover; object-position:center 20%;
  }
  .gacha-card-front .gacha-info{
    padding:6px 8px; background:rgba(0,0,0,.55);
    display:flex; flex-direction:column; gap:2px;
  }
  .gacha-card-front .gacha-name{
    font-size:.72rem; font-weight:800; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
    font-family:var(--font-display);
  }
  .gacha-card-front .gacha-rarity{
    font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  }
  .gacha-card-front .gacha-status{
    font-size:.62rem; color:var(--text-dim);
  }
  .gacha-skip-btn{
    display:block; margin:12px auto 0;
    padding:8px 24px; font-size:.82rem;
  }
  .toast{
    position:fixed; left:50%; bottom:74px; transform:translate(-50%, 12px);
    background:linear-gradient(160deg, var(--surface-2), var(--surface-3));
    border:1px solid var(--border);
    border-radius:999px; padding:9px 20px;
    font-size:.82rem; font-weight:600; color:var(--text);
    opacity:0; transition:opacity .25s ease, transform .25s ease;
    z-index:1000; pointer-events:none; max-width:90%;
    box-shadow:0 8px 28px -8px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.05) inset;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .toast-show{ opacity:1; transform:translate(-50%, 0); }
  .toast-error{ border-color:var(--rose); color:var(--rose); }
  .toast-success{ border-color:var(--success); color:var(--success); }
  .toast-info{ border-color:var(--accent2); }

  /* ============================================================
     ADMIN TOGGLE
     ============================================================ */
  .admin-toggle{
    display:none; /* affiché en JS uniquement pour le compte admin, cf. bootstrap */
    position:fixed; top:14px; right:max(14px, calc(50vw - var(--shell-max)/2 + 14px));
    z-index:50;
    width:38px; height:38px; border-radius:50%;
    background:rgba(28,23,48,.7); border:1px solid var(--border);
    color:var(--text-dim); font-size:1.05rem; cursor:pointer;
    align-items:center; justify-content:center;
    backdrop-filter:blur(4px);
    transition:color .15s ease, transform .3s ease;
  }
  .admin-toggle.visible{ display:flex; }
  .admin-toggle:hover{ color:var(--accent); transform:rotate(45deg); }

  .music-toggle{
    position:fixed; top:14px; right:max(60px, calc(50vw - var(--shell-max)/2 + 60px));
    z-index:50;
    width:38px; height:38px; border-radius:50%;
    background:rgba(28,23,48,.7); border:1px solid var(--border);
    color:var(--text-dim); font-size:1.05rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(4px);
    transition:color .15s ease, transform .2s ease, border-color .15s ease;
  }
  .music-toggle:hover{ color:var(--accent2); border-color:var(--accent2); }
  .music-toggle.is-on{ color:var(--success); border-color:var(--success); }
  .music-toggle:active{ transform:scale(.9); }

  /* Popup volume */
  .volume-popup{
    position:fixed; top:60px; right:max(14px, calc(50vw - var(--shell-max)/2 + 14px));
    z-index:51;
    background:rgba(28,23,48,.95); border:1px solid var(--border);
    border-radius:var(--radius); padding:12px 16px;
    backdrop-filter:blur(8px);
    display:none; flex-direction:column; gap:8px;
    min-width:180px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .volume-popup.open{ display:flex; }
  .volume-popup-label{
    font-size:.72rem; color:var(--text-dim); font-weight:700;
    text-transform:uppercase; letter-spacing:.08em;
  }
  .volume-slider{
    -webkit-appearance:none; appearance:none;
    width:100%; height:4px; border-radius:2px;
    background:var(--surface-3); outline:none; cursor:pointer;
  }
  .volume-slider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:16px; height:16px; border-radius:50%;
    background:var(--accent2); cursor:pointer;
    box-shadow:0 0 6px rgba(255,174,77,.6);
  }
  .volume-slider::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%;
    background:var(--accent2); cursor:pointer; border:none;
  }
  .volume-value{
    font-size:.72rem; color:var(--accent); font-family:var(--font-mono);
    text-align:right;
  }

  /* ============================================================
     GACHA — Onglets personnages / équipements
     ============================================================ */
  .gacha-tabs{
    display:flex; gap:6px; margin-bottom:16px;
  }
  .gacha-tab{
    flex:1; background:var(--surface); border:1px solid var(--border-soft);
    border-radius:999px; padding:9px 6px; cursor:pointer;
    font-family:var(--font-body); font-weight:700; font-size:.8rem;
    color:var(--text-dim); transition:all .15s ease;
  }
  .gacha-tab.active{
    border-color:var(--accent2); background:rgba(255,174,77,.15); color:var(--accent2);
  }
  .equip-banner-card::before{
    background:radial-gradient(circle, rgba(244,194,103,.2), transparent 70%) !important;
  }

  /* ============================================================
     GACHA — Animation "Nouveau personnage"
     ============================================================ */
  /* Bordure dorée pour les nouvelles obtentions */
  .gacha-card-wrap.is-new .gacha-card-front{
    border-color: var(--accent) !important;
  }
  /* Halo pulsant après retournement */
  .gacha-card-wrap.is-new.flipped .gacha-card-inner{
    animation: newCardGlow .9s ease .52s 1 both;
  }
  @keyframes newCardGlow{
    0%   { box-shadow: 0 0  0  0  rgba(244,194,103,0); }
    40%  { box-shadow: 0 0 22px 4px rgba(244,194,103,.5); }
    100% { box-shadow: 0 0  0  0  rgba(244,194,103,0); }
  }
  /* Badge flottant "NOUVEAU !" */
  .new-char-burst{
    position:absolute; top:40%; left:50%;
    transform:translate(-50%, -50%);
    z-index:20; pointer-events:none;
    font-family:var(--font-display); font-weight:900;
    font-size:1rem; white-space:nowrap;
    color:var(--accent);
    text-shadow:0 0 16px var(--accent), 0 0 40px rgba(244,194,103,.5);
    animation:newBurstAnim 1.3s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes newBurstAnim{
    0%  { opacity:0; transform:translate(-50%,-50%) scale(.4); }
    18% { opacity:1; transform:translate(-50%,-55%) scale(1.15); }
    60% { opacity:1; transform:translate(-50%,-68%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-90%) scale(.85); }
  }
  /* Statut "NOUVEAU" dans la fiche */
  .gacha-status.status-new{
    color:var(--accent); font-weight:800; font-size:.68rem; letter-spacing:.04em;
  }

  /* ============================================================
     GACHA — Badge Awakening Max
     ============================================================ */
  .gacha-card-wrap.is-awk-max .gacha-card-front{
    border-color: #f97316 !important;
  }
  .gacha-card-wrap.is-awk-max.flipped .gacha-card-inner{
    animation: awkMaxPulse 1.4s ease .52s infinite;
  }
  @keyframes awkMaxPulse{
    0%,100%{ box-shadow: 0 0  0 0  rgba(249,115,22,0); }
    50%    { box-shadow: 0 0 20px 4px rgba(249,115,22,.55); }
  }
  .gacha-status.status-awk-max{
    color:#f97316; font-weight:800; font-size:.62rem;
    line-height:1.4; letter-spacing:.03em;
  }
  .gacha-status.status-awk-max small{
    display:block; color:var(--accent); font-size:.6rem;
  }

  /* ============================================================
     ÉCRAN ÉQUIPEMENT — Layout général
     ============================================================ */
  .equip-section{
    margin-bottom:18px;
  }
  .equip-section-title{
    font-size:.72rem; text-transform:uppercase; letter-spacing:.1em;
    color:var(--text-faint); margin-bottom:10px; font-weight:700;
  }

  /* Sélecteur de personnage (scroll horizontal) */
  .equip-char-picker{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:8px;
    scroll-snap-type:x mandatory;
  }
  .equip-char-picker::-webkit-scrollbar{ height:4px; }
  .equip-char-picker::-webkit-scrollbar-thumb{ background:var(--surface-3); border-radius:2px; }
  .equip-char-mini{
    flex-shrink:0; width:76px;
    background:var(--surface); border:1.5px solid var(--border-soft);
    border-radius:var(--radius-sm); padding:8px 6px;
    text-align:center; cursor:pointer; scroll-snap-align:start;
    transition:border-color .15s, background .15s;
  }
  .equip-char-mini:hover{ border-color:var(--accent2); }
  .equip-char-mini.selected{
    border-color:var(--accent) !important;
    background:rgba(244,194,103,.07);
  }
  .equip-char-mini-name{
    font-size:.65rem; font-weight:800;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-top:4px;
  }
  .equip-char-mini-level{ font-size:.6rem; color:var(--text-faint); }

  /* Filtres "sans équipement" indépendants par catégorie (au-dessus du picker) */
  .equip-unequipped-filters{ display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 8px; }
  .equip-unequipped-filter-chip{
    display:flex; align-items:center; gap:5px;
    font-size:.7rem; color:var(--text-dim); cursor:pointer; white-space:nowrap;
  }
  .equip-unequipped-filter-chip input{ accent-color:var(--accent2); }

  /* Pastilles de slot sur les mini-cartes */
  .equip-char-slot-dots{ display:flex; gap:4px; justify-content:center; margin-top:3px; }
  .slot-dot{ width:8px; height:8px; border-radius:50%; background:var(--surface-3); }
  .slot-dot.rarity-common    { background:var(--r-common); }
  .slot-dot.rarity-uncommon  { background:var(--r-uncommon); }
  .slot-dot.rarity-rare      { background:var(--r-rare); }
  .slot-dot.rarity-epic      { background:var(--r-epic); }
  .slot-dot.rarity-legendary { background:var(--r-legendary); }
  .slot-dot.rarity-mythic    { background:var(--r-mythic, var(--r-legendary)); }

  /* Zone haute fixe (picker + slots) au-dessus de l'inventaire scrollable */
  .equip-top-zone{
    position:sticky; top:0; z-index:4;
    background:var(--bg);
    padding-bottom:12px; margin-bottom:6px;
    border-bottom:1px solid var(--border-soft);
  }

  /* Slot actuellement ouvert dans le panneau inline */
  .equip-slot-card.active{ border-color:var(--accent) !important; background:rgba(244,194,103,.1); }

  /* Panneau inline de sélection de slot (remplace le modal) */
  .equip-slot-panel{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px; margin-top:10px; animation:fadeIn .2s ease;
  }
  .equip-slot-panel-header{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
  }
  .equip-empty-card{
    border-style:dashed !important; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
  }

  /* Badge upgrade (item meilleur que l'actuel) */
  .equip-inv-card.is-upgrade{ box-shadow:0 0 0 2px var(--success); }
  .equip-upgrade-hint{ font-size:.62rem; color:var(--success); font-family:var(--font-mono); margin-top:4px; font-weight:700; }

  /* Ligne de comparaison dans le panneau de slot */
  .equip-compare{ font-size:.65rem; font-family:var(--font-mono); margin-top:5px; line-height:1.5; }
  .equip-compare .up   { color:var(--success); }
  .equip-compare .down { color:var(--danger); }
  .equip-compare .same { color:var(--text-faint); }

  /* Résumé inline de l'équipement automatique */
  .auto-equip-summary{
    background:var(--surface-2); border:1px solid var(--accent2);
    border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:10px;
    animation:fadeIn .2s ease;
  }
  .auto-equip-summary-title{
    font-family:var(--font-display); font-weight:700; font-size:.8rem;
    margin-bottom:6px; color:var(--accent2);
  }
  .auto-equip-summary-line{ font-size:.72rem; color:var(--text-dim); margin-top:3px; }
  .auto-equip-item{
    display:inline-block; font-weight:700; padding:1px 6px; border-radius:6px;
    background:var(--surface-3);
  }
  .auto-equip-item.rarity-uncommon { color:var(--r-uncommon); }
  .auto-equip-item.rarity-rare     { color:var(--r-rare); }
  .auto-equip-item.rarity-epic     { color:var(--r-epic); }
  .auto-equip-item.rarity-legendary{ color:var(--r-legendary); }
  .auto-equip-item.rarity-mythic   { color:var(--r-mythic, var(--r-legendary)); }

  /* Slots d'équipement */
  .equip-slots-row{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  }
  .equip-slot-card{
    background:var(--surface); border:1.5px dashed var(--border);
    border-radius:var(--radius); padding:10px 8px;
    text-align:center; cursor:pointer; min-height:88px;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:4px;
    transition:border-color .15s, background .15s;
  }
  .equip-slot-card.filled{ border-style:solid; }
  .equip-slot-card:hover{ border-color:var(--accent2); background:rgba(255,174,77,.06); }
  .equip-slot-label{
    font-size:.62rem; color:var(--text-faint); text-transform:uppercase;
    letter-spacing:.06em; font-weight:700;
  }
  .equip-slot-name{ font-size:.75rem; font-weight:800; }
  .equip-slot-bonuses{ font-size:.6rem; color:var(--text-dim); font-family:var(--font-mono); }
  .equip-remove-btn{
    font-size:.6rem; background:var(--danger); border:none;
    border-radius:999px; color:#fff; padding:3px 9px; cursor:pointer;
    margin-top:3px; font-weight:700;
  }

  /* Inventaire équipements */
  .equip-inv-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(128px,1fr)); gap:8px;
  }
  .equip-inv-card{
    background:var(--surface-2); border:1.5px solid var(--border);
    border-radius:var(--radius-sm); padding:10px;
    transition:border-color .15s;
    position:relative;
  }
  .equip-inv-stack-badge{
    position:absolute; top:-7px; right:-7px;
    background:var(--accent2); color:#fff;
    font-size:.66rem; font-weight:800; font-family:var(--font-mono);
    border-radius:999px; padding:2px 7px;
    box-shadow:0 2px 4px rgba(0,0,0,.4);
  }
  .equip-inv-level{
    position:absolute; top:-7px; left:-7px;
    background:var(--accent); color:#3B2000;
    font-size:.62rem; font-weight:800; font-family:var(--font-mono);
    border-radius:999px; padding:2px 7px;
    box-shadow:0 2px 4px rgba(0,0,0,.4);
  }
  .equip-inv-card:hover:not([style*="pointer-events:none"]){ border-color:var(--accent2); }
  .equip-inv-card.rarity-uncommon { border-color:var(--r-uncommon); }
  .equip-inv-card.rarity-rare     { border-color:var(--r-rare);     }
  .equip-inv-card.rarity-epic     { border-color:var(--r-epic);     }
  .equip-inv-card.rarity-legendary{ border-color:var(--r-legendary); }
  .equip-inv-name{ font-weight:800; font-size:.78rem; }
  .equip-inv-bonuses{ font-size:.64rem; color:var(--text-dim); font-family:var(--font-mono); margin-top:5px; }
  .equip-inv-slot-badge{
    display:inline-block; font-size:.6rem; color:var(--text-faint);
    background:var(--surface-3); border-radius:6px; padding:2px 6px;
    margin-bottom:5px;
  }
  .equip-inv-card.used-elsewhere{ border-style:dashed; }
  .equip-inv-holder{
    display:flex; align-items:center; gap:5px; margin-top:6px;
    padding-top:6px; border-top:1px solid var(--border-soft);
  }
  .equip-inv-holder-portrait{
    width:16px; height:16px; border-radius:50%; flex-shrink:0; overflow:hidden;
    background:var(--surface-3); display:flex; align-items:center; justify-content:center;
    font-size:.55rem; font-weight:700; color:var(--text-faint);
    font-family:var(--font-display);
  }
  .equip-inv-holder-portrait img{ width:100%; height:100%; object-fit:cover; }
  .equip-inv-holder-name{ font-size:.6rem; color:var(--text-faint); }

  /* Section item (pillule) */
  .item-section{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface); border:1px solid var(--border-soft);
    border-radius:var(--radius); padding:12px 14px;
  }
  .item-info{ display:flex; align-items:center; gap:10px; }
  .item-icon{ font-size:1.5rem; line-height:1; }
  .item-name{ font-weight:800; font-size:.88rem; }
  .item-desc{ font-size:.72rem; color:var(--text-dim); margin-top:2px; }
  .item-count{
    font-family:var(--font-mono); font-weight:800; font-size:1.1rem;
    color:var(--accent);
  }
  .btn-item-use{
    background:linear-gradient(135deg, var(--accent), var(--accent-deep));
    border:none; border-radius:999px; color:#3B2000;
    font-weight:800; font-size:.78rem; padding:9px 16px; cursor:pointer;
    white-space:nowrap;
  }
  .btn-item-use:disabled{ opacity:.35; cursor:not-allowed; }
  .item-section + .item-section{ margin-top:10px; }
  .item-section-empty{ opacity:.45; }

  /* ============================================================
     BOUTIQUE
     ============================================================ */
  .shop-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(126px,1fr));
    gap:10px; margin-top:14px;
  }
  .shop-card{
    background:var(--surface); border:1.5px solid var(--border-soft);
    border-radius:var(--radius); padding:12px 8px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .shop-card-portrait{
    width:64px; height:64px; border-radius:50%; flex-shrink:0;
    background:var(--surface-2); border:2px solid var(--border-soft);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    font-family:var(--font-display); font-weight:700; font-size:1.3rem; color:var(--text-faint);
  }
  .shop-card-portrait img{ width:100%; height:100%; object-fit:cover; object-position:center 20%; }
  .shop-card-name{ font-size:.78rem; font-weight:700; }
  .shop-card-rarity{ font-size:.64rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-top:-4px; filter:brightness(.6) saturate(1.3); }
  .btn-shop-buy{
    margin-top:4px; width:100%;
    background:linear-gradient(135deg, var(--rose), var(--accent2-deep));
    border:none; border-radius:999px; color:#fff;
    font-weight:800; font-size:.76rem; font-family:var(--font-mono); padding:8px 10px; cursor:pointer;
    transition:box-shadow .15s, transform .12s;
  }
  .btn-shop-buy:hover{ box-shadow:0 4px 14px -4px var(--rose-glow); transform:translateY(-1px); }
  .btn-shop-buy:disabled{ opacity:1; cursor:not-allowed; background:var(--surface-3); color:var(--text-faint); }

  /* ============================================================
     QUÊTES QUOTIDIENNES & RÉCOMPENSE DE CONNEXION
     ============================================================ */
  .login-cycles-list{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .login-cycle-card{
    background:var(--surface); border:1.5px solid var(--border-soft);
    border-radius:var(--radius); padding:10px 12px;
  }
  .login-cycle-title{ font-family:var(--font-display); font-weight:700; font-size:.85rem; margin-bottom:8px; }
  .login-cycle-days{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
  .login-day-chip{
    flex-shrink:0; width:56px; text-align:center;
    background:var(--surface-2); border:1.5px solid var(--border-soft);
    border-radius:var(--radius-sm); padding:6px 4px; position:relative;
  }
  .login-day-chip.current{ border-color:var(--accent); background:rgba(244,194,103,.1); }
  .login-day-chip.done{ opacity:.55; }
  .login-day-chip.locked{ opacity:.4; }
  .login-day-num{ font-size:.62rem; font-weight:800; color:var(--text-faint); font-family:var(--font-mono); }
  .login-day-reward{ font-size:.66rem; font-weight:700; margin-top:3px; }
  .login-day-check{
    position:absolute; top:-6px; right:-6px;
    background:var(--success); color:#fff; border-radius:50%;
    width:16px; height:16px; font-size:.6rem;
    display:flex; align-items:center; justify-content:center;
  }
  .login-day-lock{
    position:absolute; top:-6px; right:-6px;
    font-size:.62rem; background:var(--surface-3); border-radius:50%;
    width:16px; height:16px; display:flex; align-items:center; justify-content:center;
  }

  .quest-cards-list{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .quest-card{
    background:var(--surface); border:1.5px solid var(--border-soft);
    border-radius:var(--radius); padding:12px 14px;
  }
  .quest-card.quest-complete{ border-color:var(--accent2); }
  .quest-card.quest-claimed{ opacity:.55; }
  .quest-card-name{ font-weight:800; font-size:.85rem; margin-bottom:8px; }
  .quest-progress-bar-wrap{
    height:8px; border-radius:4px; overflow:hidden;
    background:var(--surface-2); border:1px solid var(--border-soft);
  }
  .quest-progress-bar-fill{
    height:100%;
    background:linear-gradient(90deg, var(--rose-deep), var(--rose), var(--accent));
    transition:width .4s ease; position:relative; overflow:hidden;
  }
  .quest-progress-bar-fill::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
    animation:barShimmer 2.8s ease-in-out infinite;
  }
  .quest-progress-label{ font-size:.68rem; color:var(--text-dim); font-family:var(--font-mono); margin-top:4px; }
  .quest-reward-label{ font-size:.74rem; font-weight:700; color:var(--accent); margin-top:6px; }
  .btn-quest-claim{
    width:100%; margin-top:10px;
    background:linear-gradient(135deg, var(--accent2), var(--accent2-deep));
    border:none; border-radius:999px; color:#fff;
    font-weight:800; font-size:.78rem; font-family:var(--font-mono); padding:8px 10px; cursor:pointer;
  }
  .btn-quest-claim:disabled{ opacity:1; cursor:not-allowed; background:var(--surface-3); color:var(--text-faint); }

  /* Popup de réclamation de connexion quotidienne */
  .daily-login-popup{ max-width:380px; }
  .login-cycle-days-popup{ margin:12px 0 16px; flex-wrap:wrap; justify-content:center; }
  .daily-claim-zone{ margin-top:14px; min-height:74px; display:flex; align-items:center; justify-content:center; }
  .btn-claim-daily-reward, .btn-claim-daily-inline{
    width:100%;
    background:linear-gradient(135deg, var(--rose), var(--accent), #f0b840);
    border:none; border-radius:999px; color:#180F09;
    font-weight:800; font-size:.85rem; font-family:var(--font-display); padding:12px 14px; cursor:pointer;
    box-shadow:0 4px 18px -4px rgba(232,85,122,.5);
  }
  .btn-claim-daily-inline{ font-size:.76rem; padding:9px 12px; }

  /* Animation "Validé" : doit se jouer entièrement avant disparition */
  .daily-claim-validated{
    text-align:center; opacity:0; transform:scale(.7);
    transition:opacity .3s ease, transform .3s cubic-bezier(.3,1.6,.4,1);
  }
  .daily-claim-validated.visible{ opacity:1; transform:scale(1); }
  .validated-checkmark{
    width:52px; height:52px; border-radius:50%; margin:0 auto 6px;
    background:var(--success); color:#fff; font-size:1.6rem; font-weight:900;
    display:flex; align-items:center; justify-content:center;
    animation:validatedPulse 1.6s ease-in-out;
  }
  @keyframes validatedPulse{
    0%{ box-shadow:0 0 0 0 rgba(74,222,128,.6); }
    40%{ box-shadow:0 0 0 14px rgba(74,222,128,0); }
    100%{ box-shadow:0 0 0 0 rgba(74,222,128,0); }
  }
  .validated-text{ font-family:var(--font-display); font-weight:800; font-size:1rem; color:var(--success); }
  .validated-reward-label{ font-size:.78rem; color:var(--text-dim); margin-top:4px; }

  /* ============================================================
     GACHA ÉQUIPEMENTS — Résultats
     ============================================================ */
  .equip-result-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(116px,1fr));
    gap:10px; margin-top:16px;
  }
  .equip-result-card{
    background:var(--surface); border:1.5px solid var(--border-soft);
    border-radius:var(--radius); padding:12px 10px; text-align:center;
    animation:resultPop .4s cubic-bezier(.34,1.56,.64,1) backwards;
  }
  .equip-result-card.rarity-uncommon { border-color:var(--r-uncommon); }
  .equip-result-card.rarity-rare     { border-color:var(--r-rare);     }
  .equip-result-card.rarity-epic     { border-color:var(--r-epic);     }
  .equip-result-card.rarity-legendary{ border-color:var(--r-legendary); }
  .equip-result-icon{ font-size:1.9rem; margin-bottom:6px; }
  .equip-result-name{ font-weight:800; font-size:.78rem; }
  .equip-result-bonuses{
    font-size:.62rem; color:var(--text-dim); font-family:var(--font-mono); margin-top:6px; line-height:1.5;
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (min-width:680px) and (pointer:fine){
    body{ overflow:auto; }
    .app-shell{ min-height:100vh; height:auto; border-left:1px solid var(--border-soft); border-right:1px solid var(--border-soft); }
    .main-content{ max-height:none; }
  }

  /* ============================================================
     MOBILE (écrans tactiles UNIQUEMENT — jamais la version PC).
     Placé en tout dernier dans la feuille de style pour être sûr de
     l'emporter sur les règles de base qui le précèdent (même sélecteur,
     même spécificité CSS → c'est l'ordre d'apparition qui décide).
     ============================================================ */
  @media (pointer:coarse){
    .app-shell{
      max-width:100%;
      width:100%;
      margin:0;
      border-left:none;
      border-right:none;
      height:100dvh; /* hauteur RÉELLEMENT visible sur mobile (exclut les barres du navigateur/du téléphone), 100vh les inclut parfois à tort */
    }
    /* Pendant un combat, l'en-tête libère sa place pour laisser le maximum
       de hauteur disponible à la scène de combat (3 alliées + 3 ennemies). */
    body.battle-active .app-header{ display:none; }

    /* Combat : les 3 combattants d'un même camp restent TOUJOURS sur une
       seule ligne (jamais de retour à la ligne), quelle que soit la largeur
       exacte du téléphone — les cartes rétrécissent plutôt que de wrapper. */
    .battle-fighters{ flex-wrap:nowrap; gap:5px; }
    .fighter-card{ min-width:0; max-width:none; flex:1 1 0; padding:8px 3px 6px; gap:4px; }
    .fighter-portrait{ width:50px; height:50px; font-size:1.05rem; }

    /* La barre de nav occupe maintenant vraiment toute la largeur du
       téléphone (fini les bandes crème) : moins de place par bouton
       qu'avant. On réduit leur taille et on autorise le texte à passer sur
       2 lignes plutôt que de se chevaucher avec le bouton voisin. */
    .app-nav-new{ padding-left:2px; padding-right:2px; gap:2px; }
    .nav-new-btn{ padding:5px 2px; }
    .nav-new-btn .nav-ico{ font-size:16px; }
    .nav-new-btn .nav-lbl{ font-size:.5rem; letter-spacing:0; white-space:normal; text-align:center; line-height:1.05; }
    .nav-combat-btn{ width:54px; height:54px; }
    .nav-combat-btn .nav-ico{ font-size:18px; }
    .nav-combat-btn .nav-lbl{ font-size:.48rem; }
  }
</style>
</head>

      <div class="tuto-box">

  <!-- ============================================================
       ÉCRAN DE CONNEXION / INSCRIPTION
       Affiché par-dessus tout le reste tant que le joueur n'est pas
       authentifié. Masqué (display:none) une fois connecté.
       ============================================================ -->
  <div id="auth-screen" class="hidden">
    <div class="auth-box">
      <h1 class="auth-title">WildBeast</h1>
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="auth-tab-login">Connexion</button>

        <input type="email" id="auth-email" placeholder="Email" autocomplete="email" required />
        <input type="password" id="auth-password" placeholder="Mot de passe" autocomplete="current-password" minlength="6" required />
        <div class="auth-error" id="auth-error" style="display:none"></div>
        <button type="submit" class="auth-submit-btn" id="auth-submit-btn">Se connecter</button>
      </form>
      <p class="auth-hint" id="auth-hint"></p>
    </div>

  <!-- Lecteur audio caché pour la musique de fond (fichiers importés depuis le PC) -->

  <!-- Client Supabase (backend) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ============================================================
       GAME SCRIPTS — l'ordre est important (dépendances)
       ============================================================ -->
  <script src="database.js"></script>
  <script src="state.js"></script>
  <script src="gacha.js"></script>
  <script src="engine.js"></script>
  <script src="evolution.js"></script>
  <script src="audio.js"></script>
  <script src="ui.js"></script>
  <script src="admin.js"></script>
  <script src="backend.js"></script>
  <script src="save.js"></script>

  <script>
    'use strict';

    // ── ÉCRAN DE CONNEXION / INSCRIPTION ──────────────────────────────────────
    // Gère uniquement l'UI de connexion et retourne une session valide.
    // Aucune logique de jeu ici.
    const WBAuthScreen = (() => {
      let _mode = 'login'; // 'login' | 'signup'

      function _setMode(mode) {
        _mode = mode;
        document.getElementById('auth-tab-login')?.classList.toggle('active', mode === 'login');
        document.getElementById('auth-tab-signup')?.classList.toggle('active', mode === 'signup');
        document.getElementById('auth-submit-btn').textContent = mode === 'login' ? 'Se connecter' : 'Créer mon compte';
        document.getElementById('auth-hint').textContent = mode === 'login'
          ? "Pas encore de compte ? Clique sur \u00ab Inscription \u00bb ci-dessus."
          : 'Le mot de passe doit faire au moins 6 caractères.';
        _showError('');
      }

      function _showError(msg) {
        const el = document.getElementById('auth-error');
        if (!el) return;
        el.style.display = msg ? 'block' : 'none';
        el.textContent = msg || '';
      }

      /**
       * Affiche l'écran de connexion et ne se résout qu'une fois le joueur
       * authentifié avec succès (inscription ou connexion).
       * @returns {Promise<object>} la session Supabase active
       */
      function ensureAuthenticated() {
        return new Promise(async (resolve) => {
          // Déjà connecté (session persistée par Supabase) ? On saute l'écran.
          const existing = await WBBackend.getSession();
          if (existing) {
            document.getElementById('auth-screen')?.classList.add('hidden');
            resolve(existing);
            return;
          }

          const screen = document.getElementById('auth-screen');
          const form   = document.getElementById('auth-form');
          const btn    = document.getElementById('auth-submit-btn');
          screen.classList.remove('hidden');
          _setMode('login');

          document.getElementById('auth-tab-login')?.addEventListener('click', () => _setMode('login'));
          document.getElementById('auth-tab-signup')?.addEventListener('click', () => _setMode('signup'));

          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email    = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            _showError('');
            btn.disabled = true;
            try {
              const data = _mode === 'login'
                ? await WBBackend.signIn(email, password)
                : await WBBackend.signUp(email, password);

              if (!data.session) {
                // Cas Supabase : confirmation email requise avant de pouvoir se connecter
                _showError("Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse, puis connecte-toi.");
                _setMode('login');
                btn.disabled = false;
                return;
              }
              screen.classList.add('hidden');
              resolve(data.session);
            } catch (err) {
              _showError(err.message || 'Une erreur est survenue.');
              btn.disabled = false;
            }
          });
        });
      }

      return { ensureAuthenticated };
    })();

    (async function bootstrap() {
      // 1. Se connecter à Supabase et attendre que le joueur soit authentifié
      WBBackend.init();
      const session = await WBAuthScreen.ensureAuthenticated();
      const userId  = session.user.id;
      WBBackend.setCurrentUserId(userId);

      // 2. Charger en parallèle : données de jeu partagées, sauvegarde du joueur,
      //    et statut admin de ce compte
      const [gameData, playerData, isAdmin] = await Promise.all([
        WBBackend.loadGameData(),
        WBBackend.loadPlayerSave(userId),
        WBBackend.isCurrentUserAdmin(userId),
      ]);

      // 3. Initialiser l'état du jeu : on fusionne les deux moitiés dans la
      //    forme attendue par WBGameState.init(). Les clés manquantes (première
      //    connexion, ou données de jeu jamais encore sauvegardées par l'admin)
      //    sont automatiquement complétées par les valeurs par défaut du jeu.
      WBGameState.init({ ...gameData, player: playerData || undefined });

      // 4. Autosave : scindée entre données de jeu (admin uniquement) et
      //    sauvegarde joueur — dans les deux cas, seulement si les données ont
      //    réellement changé depuis le dernier envoi réussi (évite de spammer
      //    Supabase de requêtes identiques, en particulier via le filet de
      //    sécurité périodique plus bas qui, sinon, réenverrait tout toutes
      //    les 30s pour CHAQUE joueur connecté, même sans la moindre activité).
      let _lastGameDataJSON   = JSON.stringify(gameData);
      let _lastPlayerJSON     = JSON.stringify(playerData || {});
      // Compteur de sauvegardes Supabase en cours (jamais négatif). Tant qu'il
      // est > 0, un rechargement/une fermeture de la page perdrait la dernière
      // modification (cf. avertissement beforeunload plus bas).
      let _pendingSaveCount = 0;
      // Garde interne : quand true, _persist ne fait RIEN — ni la version
      // déclenchée par les mutations, ni celle du minuteur périodique de
      // sécurité plus bas (les deux passent par CETTE fonction, donc les
      // couper ici les coupe bien toutes les deux en même temps).
      let _autosaveSuspended = false;
      function _persist(state) {
        if (_autosaveSuspended) return; // édition d'un autre joueur en cours, cf. admin.js
        const { player, ...structural } = state;

        const playerJson = JSON.stringify(player);
        if (playerJson !== _lastPlayerJSON) {
          _pendingSaveCount++;
          WBBackend.savePlayerData(userId, player)
            .then(() => {
              _lastPlayerJSON = playerJson;
              // Publie aussi les chiffres de classement (calculés localement,
              // peu coûteux) — utilise le nom en jeu du joueur, plus parlant
              // qu'un email dans un classement public.
              const snapshot = WBGameState.getLeaderboardSnapshot?.();
              if (snapshot) {
                WBBackend.saveLeaderboardStats(userId, player.name || 'Ranger', snapshot)
                  .catch(err => console.error('[Autosave] Classement :', err));
              }
            })
            .catch(err => console.error('[Autosave] Progression joueur :', err))
            .finally(() => { _pendingSaveCount = Math.max(0, _pendingSaveCount - 1); });
          // Note : _lastPlayerJSON n'est mis à jour qu'en cas de succès — un
          // échec laisse la valeur différente, donc le prochain passage
          // (mutation suivante ou filet de sécurité périodique) retentera
          // automatiquement l'envoi.
        }

        if (isAdmin) {
          const json = JSON.stringify(structural);
          if (json !== _lastGameDataJSON) {
            _pendingSaveCount++;
            WBBackend.saveGameData(structural)
              .then(() => { _lastGameDataJSON = json; })
              .catch(err => console.error('[Autosave] Données de jeu :', err))
              .finally(() => { _pendingSaveCount = Math.max(0, _pendingSaveCount - 1); });
          }
        }
      }
      WBGameState.setAutoSaveFn(_persist);

      // Avertit avant de quitter/recharger la page tant qu'une sauvegarde vers
      // Supabase est encore en cours — évite de perdre la toute dernière
      // modification (ex: config admin) si la page est rechargée trop vite
      // après avoir cliqué sur "Enregistrer".
      window.addEventListener('beforeunload', (e) => {
        if (_pendingSaveCount > 0) {
          e.preventDefault();
          e.returnValue = '';
        }
      });

      // Publication initiale des chiffres de classement à la connexion (pas
      // seulement après une modification) : garantit que même un joueur qui
      // ne fait encore rien de nouveau ce jour-là apparaît bien au classement.
      {
        const initialSnapshot = WBGameState.getLeaderboardSnapshot?.();
        if (initialSnapshot) {
          WBBackend.saveLeaderboardStats(userId, WBGameState.getPlayer().name || 'Ranger', initialSnapshot)
            .catch(err => console.error('[Classement] Publication initiale :', err));
        }
      }

      // Points d'entrée pour l'admin (cf. admin.js) : le temps d'éditer les
      // données d'un AUTRE joueur, on ne veut surtout pas qu'une sauvegarde
      // (automatique OU périodique) parte vers le compte de l'admin avec les
      // données du joueur ciblé temporairement chargées dans _state.player.
      window.__cwSuspendAutosave = () => { _autosaveSuspended = true; };
      window.__cwRestoreAutosave = () => { _autosaveSuspended = false; };

      // 5. Initialiser l'interface
      WBGameUI.init();

      // 6. Panneau d'administration : initialisé et accessible UNIQUEMENT si
      //    ce compte a les droits admin (vérifié côté serveur, cf. Supabase RLS —
      //    le masquage ici n'est qu'un confort d'affichage, pas la vraie sécurité)
      if (isAdmin) {
        WBAdminPanel.init();
        const toggleBtn = document.getElementById('admin-toggle');
        toggleBtn?.classList.add('visible');
        toggleBtn?.addEventListener('click', () => WBAdminPanel.toggle());
      }

      // 7. Filet de sécurité : re-sauvegarde périodique (toutes les 30s), au cas
      //    où une mutation aurait échappé au déclenchement automatique. Passe
      //    par la MÊME fonction _persist (donc par la même garde de suspension
      //    ci-dessus) — jamais un appel indépendant qui la contournerait.
      setInterval(() => _persist(WBGameState.get()), 30000);

      // 8. Sauvegarder aussi quand on quitte/rafraîchit la page (best effort :
      //    une requête réseau au unload n'est jamais garantie d'aboutir, mais
      //    l'autosave périodique + à chaque mutation couvre déjà l'essentiel)
      window.addEventListener('beforeunload', () => {
        if (_autosaveSuspended) return; // édition d'un autre joueur en cours, cf. admin.js
        const state = WBGameState.get();
        WBBackend.savePlayerData(userId, state.player).catch(() => {});
      });
    })();
  </script>
</body>
