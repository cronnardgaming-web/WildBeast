<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>WildBeast Chronicles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     TOKENS
     ============================================================ */
  :root{
    --bg:           #FFF6E7;   /* crème savane */
    --bg-2:         #FFEFD8;
    --surface:      #FFFFFF;
    --surface-2:    #FFF9EE;
    --surface-3:    #FFF2DC;
    --border:       #EDDDBE;
    --border-soft:  #F5EAD3;

    --text:         #3B2E23;   /* brun chaud, jamais de noir pur */
    --text-dim:     #7A5230;
    --text-faint:   #A98F6E;

    --accent:       #FF8A3D;   /* orange coucher de soleil */
    --accent-deep:  #D9691F;
    --accent2:      #2FB4C7;   /* turquoise savane */
    --accent2-deep: #1F8A99;

    --rose:         #E85A3D;   /* corail chaud (accent tertiaire) */
    --rose-deep:    #B8431F;
    --champagne:    #F0D5A0;   /* or savane */
    --rose-glow:    rgba(232,90,61,.22);
    --gold-glow:    rgba(255,138,61,.18);
    --silk:         rgba(0,0,0,.03);

    --danger:       #F0617A;
    --success:      #3E9B5C;

    --r-common:     #9CA3AF;
    --r-uncommon:   #34D399;
    --r-rare:       #60A5FA;
    --r-epic:       #A78BFA;
    --r-legendary:  #F59E0B;
    --r-mythic:     #F43F5E;

    --radius-lg:    20px;
    --radius:       14px;
    --radius-sm:    9px;

    --font-display: 'Baloo 2', sans-serif;
    --font-body:    'Nunito', sans-serif;
    --font-mono:    'Space Mono', monospace;

    --shell-max:    640px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:var(--font-body);
    color:var(--text);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  ::selection{ background:var(--accent2); color:#fff; }

  /* ============================================================
     AMBIENT BACKGROUND — "rift" glow
     ============================================================ */
  .bg-decor{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 700px 500px at 15% -10%,  rgba(255,174,77,.32), transparent 60%),
      radial-gradient(ellipse 500px 420px at 108% 18%,  rgba(232,85,122,.18), transparent 60%),
      radial-gradient(ellipse 600px 500px at 50% 115%,  rgba(93,79,196,.28), transparent 60%),
      radial-gradient(ellipse 360px 300px at 78% 85%,   rgba(244,194,103,.12), transparent 60%),
      radial-gradient(ellipse 280px 220px at 5%  72%,   rgba(160,53,88,.14), transparent 70%),
      linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 60%);
  }
  .bg-decor::after{
    content:''; position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.55) 0, transparent 1px),
      radial-gradient(circle at 70% 65%, rgba(255,255,255,.45) 0, transparent 1px),
      radial-gradient(circle at 85% 20%, rgba(255,200,220,.5)  0, transparent 1px),
      radial-gradient(circle at 40% 80%, rgba(255,255,255,.4)  0, transparent 1px),
      radial-gradient(circle at 55% 45%, rgba(255,255,255,.35) 0, transparent 1px),
      radial-gradient(circle at 10% 90%, rgba(255,200,220,.4)  0, transparent 1px),
      radial-gradient(circle at 62% 10%, rgba(255,255,255,.35) 0, transparent 1px),
      radial-gradient(circle at 30% 55%, rgba(255,220,200,.3)  0, transparent 1px);
    background-size: 540px 540px;
    opacity:.55;
  }

  /* ============================================================
     APP SHELL
     ============================================================ */
  .app-shell{
    position:relative; z-index:1;
    max-width:var(--shell-max);
    margin:0 auto;
    height:100vh;
    display:flex; flex-direction:column;
    background:linear-gradient(180deg, rgba(26,18,8,.6), rgba(8,6,21,.65));
    border-left:1px solid rgba(255,255,255,.06);
    border-right:1px solid rgba(255,255,255,.06);
    box-shadow:0 0 80px rgba(0,0,0,.6), inset 0 0 0 1px var(--silk);
  }

  /* Sur smartphone (écran tactile, quelle que soit sa largeur exacte) : l'app
     colle aux deux bords de l'écran, jamais de bande de fond visible sur les
     côtés. Ciblé sur "pointer:coarse" plutôt qu'une simple largeur, pour ne
     JAMAIS affecter la version PC — même une fenêtre de bureau réduite très
     étroite garde son cadre centré habituel. */


  /* ── HEADER ── */
  .app-header{
    flex:0 0 auto;
    padding:14px 16px 10px;
    border-bottom:1px solid rgba(255,255,255,.05);
    background:linear-gradient(180deg, rgba(20,15,38,.55), rgba(12,9,26,.45));
    backdrop-filter:blur(10px);
  }
  .logo{
    display:flex; align-items:center; gap:10px;
    margin-bottom:10px;
  }
  .logo-icon{
    font-size:1.4rem;
    filter:drop-shadow(0 0 8px rgba(244,194,103,.8)) drop-shadow(0 0 3px rgba(232,85,122,.4));
    animation:tick 4s linear infinite;
    display:inline-block;
  }
  @keyframes tick{
    0%,92%{ transform:rotate(0deg); }
    96%{ transform:rotate(-12deg); }
    100%{ transform:rotate(0deg); }
  }
  .logo h1{
    margin:0; font-family:var(--font-display); font-weight:700;
    font-size:1.05rem; letter-spacing:.04em; line-height:1.1;
    background:linear-gradient(90deg, var(--text) 20%, var(--champagne) 60%, var(--text) 80%);
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:logoShimmer 6s linear infinite;
  }
  @keyframes logoShimmer{
    0%{ background-position:200% center; }
    100%{ background-position:-200% center; }
  }
  .logo h1 span{
    display:block; font-size:.68rem; font-weight:500; letter-spacing:.22em;
    color:var(--accent); text-transform:uppercase; margin-top:2px;
    -webkit-text-fill-color:var(--accent);
  }

  /* ── Barre Joueur (nom, niveau, XP) ── */
  #player-info-bar{
    display:flex; align-items:center; gap:8px;
    margin-bottom:8px;
  }
  .player-info-name{
    font-family:var(--font-display); font-weight:700; font-size:.85rem;
    color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:120px;
  }
  .player-info-level{
    flex:0 0 auto;
    background:linear-gradient(135deg, var(--accent2), var(--accent2-deep));
    color:#fff; font-family:var(--font-mono); font-weight:700; font-size:.68rem;
    border-radius:999px; padding:3px 9px; white-space:nowrap;
  }
  .player-xp-bar-wrap{
    flex:1 1 auto; min-width:50px;
    height:6px; border-radius:3px; overflow:hidden;
    background:var(--surface-3); border:1px solid var(--border-soft);
  }
  .player-xp-bar-fill{
    height:100%;
    background:linear-gradient(90deg, var(--rose-deep), var(--rose), var(--accent));
    transition:width .4s ease; position:relative; overflow:hidden;
  }
  .player-xp-bar-fill::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
    animation:barShimmer 3s ease-in-out infinite;
  }

  /* ── HUD ── */
  #hud{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .hud-item{
    display:flex; align-items:center; gap:6px;
    background:rgba(26,18,8,.7);
    border:1px solid rgba(255,255,255,.07);
    border-radius:999px;
    padding:5px 12px;
    font-family:var(--font-mono);
    font-size:.78rem;
    color:var(--text);
    backdrop-filter:blur(4px);
  }
  .hud-icon{ font-size:.95rem; }
  .hud-mute-btn{
    cursor:pointer; border:1px solid rgba(255,255,255,.07); padding:5px 9px;
    transition:border-color .15s ease, background .15s ease;
  }
  .hud-mute-btn:hover{ border-color:var(--accent2); background:rgba(255,174,77,.1); }
  .hud-bar{
    width:46px; height:4px; border-radius:2px; overflow:hidden;
    background:var(--surface-3); margin-left:2px; position:relative;
  }
  .hud-bar-fill{
    height:100%;
    background:linear-gradient(90deg, var(--rose-deep), var(--rose), var(--accent));
    transition:width .4s ease;
  }

  /* ── MAIN CONTENT ── */
  .main-content{
    flex:1 1 auto;
    overflow:hidden;
    display:flex; flex-direction:column;
    -webkit-overflow-scrolling:touch;
    position:relative;
  }
  /* Écrans normaux avec scroll et padding */
  .screen{ display:none; animation:fadeIn .3s ease; overflow-y:auto; padding:16px 16px 28px; flex:1; }
  .screen.active{ display:block; }
  /* Hub et combat-select : pas de padding, flex */
  #screen-hub, #screen-combat-select{ flex:1; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .screen-header{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px; margin-bottom:16px;
  }
  .screen-header h2{
    font-family:var(--font-display); font-weight:700; font-size:1.2rem;
    margin:0; letter-spacing:.02em;
    display:flex; align-items:center; gap:8px;
  }
  .screen-header h2 small{
    font-family:var(--font-body); font-weight:500; font-size:.75rem; color:var(--text-dim);
  }
  .badge{
    background:var(--accent2); color:#fff;
    border-radius:999px; padding:2px 10px;
    font-size:.72rem; font-weight:700; font-family:var(--font-mono);
  }
  .search-input{
    background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:7px 14px;
    color:var(--text); font-family:var(--font-body); font-size:.82rem;
    outline:none; min-width:140px;
  }
  .search-input:focus{ border-color:var(--accent2); }
  .search-input::placeholder{ color:var(--text-faint); }

  .screen-controls{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .sort-select{
    background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:7px 12px;
    color:var(--text); font-family:var(--font-body); font-size:.78rem;
    outline:none; cursor:pointer;
  }
  .sort-select:focus{ border-color:var(--accent2); }

  .filter-bar{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    margin-bottom:12px; padding:10px; background:var(--surface);
    border:1px solid var(--border-soft); border-radius:var(--radius-sm);
  }
  .stat-filter-group{ display:flex; gap:6px; align-items:center; }
  .stat-filter-input{ width:64px; min-width:64px; padding:7px 10px; }

  .equip-inv-tabs{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .equip-inv-tab-btn{
    flex:1 1 auto; min-width:100px; background:var(--surface); border:1px solid var(--border-soft);
    border-radius:999px; padding:8px 10px; cursor:pointer;
    font-family:var(--font-body); font-weight:700; font-size:.76rem;
    color:var(--text-dim); transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .equip-inv-tab-btn:hover{ border-color:var(--accent2); color:var(--text); }
  .equip-inv-tab-btn.active{
    border-color:var(--accent2); background:rgba(255,174,77,.15); color:var(--accent2);
  }

  .empty-msg{
    text-align:center; color:var(--text-faint);
    padding:2.5rem 1rem; font-size:.9rem;
  }

  /* ── CLASSEMENTS ── */
  .lb-tabs{ display:flex; gap:6px; margin:10px 0 14px; }
  .lb-tab{
    flex:1; background:rgba(255,255,255,.05); border:1px solid var(--border-soft, rgba(255,255,255,.1));
    border-radius:10px; padding:9px 6px; color:var(--text-dim); font-size:.8rem; font-weight:700;
    cursor:pointer; transition:background .15s, color .15s, border-color .15s;
  }
  .lb-tab.active{ background:var(--accent, #FFB255); color:#3B2000; border-color:var(--accent, #FFB255); }
  .lb-list{ display:flex; flex-direction:column; gap:6px; }
  .lb-row{
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
    border-radius:10px; padding:9px 12px;
  }
  .lb-row.is-me{
    background:rgba(255,178,85,.14); border-color:rgba(255,178,85,.5);
  }
  .lb-rank{ width:34px; flex-shrink:0; text-align:center; font-weight:800; font-size:.9rem; }
  .lb-name{ flex:1; font-size:.85rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-value{ font-family:var(--font-mono); font-size:.85rem; color:var(--accent, #FFB255); font-weight:700; white-space:nowrap; }

  /* ── NAV ── */
  #main-nav{
    flex:0 0 auto;
    display:flex;
    border-top:1px solid rgba(255,255,255,.05);
    background:linear-gradient(0deg, rgba(8,6,21,.85), rgba(15,11,32,.75));
    backdrop-filter:blur(12px);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--text-faint);
    padding:10px 2px 9px; cursor:pointer;
    font-family:var(--font-body);
    transition:color .2s ease;
    position:relative;
  }
  .nav-btn .nav-icon{ font-size:1.25rem; line-height:1; filter:grayscale(.5); transition:filter .2s, transform .2s; }
  .nav-btn .nav-label{ font-size:.6rem; font-weight:700; letter-spacing:.04em; }
  .nav-btn.active{ color:var(--accent); }
  .nav-btn.active .nav-icon{ filter:none; transform:scale(1.1); }
  .nav-btn.active::after{
    content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:32px; height:2px;
    background:linear-gradient(90deg, var(--rose), var(--accent), var(--rose));
    border-radius:2px 2px 0 0;
    box-shadow:0 0 8px 1px var(--rose-glow), 0 0 16px 2px var(--gold-glow);
  }
  .nav-btn:active{ color:var(--accent); }

  /* ============================================================
     CARD GRID (collection / team selector / gacha results)
     ============================================================ */
  .card-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(132px,1fr));
    gap:10px;
  }
  .char-card{
    background:linear-gradient(160deg, var(--surface), var(--surface-2));
    border:1px solid var(--border-soft);
    border-top:3px solid var(--rc, var(--border));
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    transition:transform .22s ease, box-shadow .22s ease;
  }
  .char-card:hover{
    transform:translateY(-4px) scale(1.015);
    box-shadow:0 12px 28px -8px rgba(0,0,0,.6), 0 0 0 1px var(--rc, var(--border-soft));
  }
  .char-card.rarity-common    { --rc:var(--r-common); }
  .char-card.rarity-uncommon  { --rc:var(--r-uncommon); }
  .char-card.rarity-rare      { --rc:var(--r-rare); }
  .char-card.rarity-epic      { --rc:var(--r-epic); }
  .char-card.rarity-legendary { --rc:var(--r-legendary); animation:rarityGlow 2.6s ease-in-out infinite; }
  .char-card.rarity-mythic    { --rc:var(--r-mythic); animation:rarityGlow 2.2s ease-in-out infinite; }
  @keyframes rarityGlow{
    0%,100%{ box-shadow:0 0 0 rgba(0,0,0,0); }
    50%{ box-shadow:0 0 22px -2px var(--rc); }
  }

  /* ============================================================
     AURA AWAKENING MAX — palier ultime (niveau 12)
     Box-shadow plutôt que pseudo-élément : non rogné par overflow:hidden,
     et placé après les règles de rareté pour primer dessus en cas de cumul.
     ============================================================ */
  .char-card.awakening-max,
  .team-member-card.awakening-max,
  .detail-portrait.awakening-max{
    animation:awakeningAura 2.4s ease-in-out infinite;
    position:relative;
  }
  @keyframes awakeningAura{
    0%,100%{ box-shadow:0 0 7px 1px rgba(255,221,128,.55), 0 0 0 1px rgba(255,221,128,.4) inset; }
    50%{     box-shadow:0 0 22px 5px rgba(255,221,128,.95), 0 0 0 2px rgba(255,255,255,.6) inset; }
  }
  .char-card.awakening-max::after,
  .team-member-card.awakening-max::after,
  .detail-portrait.awakening-max::after{
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.4) 50%, transparent 70%);
    animation:awakeningShine 2.8s ease-in-out infinite;
    pointer-events:none; z-index:6;
  }
  @keyframes awakeningShine{
    0%   { transform:translateX(-130%); opacity:0; }
    12%  { opacity:1; }
    50%  { transform:translateX(130%);  opacity:1; }
    62%  { opacity:0; }
    100% { transform:translateX(130%);  opacity:0; }
  }
  /* Variante combat : appliquée au portrait (élément séparé de la carte,
     pour ne pas entrer en conflit avec l'animation d'entrée de .fighter-card) */
  .fighter-portrait.awakening-max{
    animation:awakeningAura 2.4s ease-in-out infinite, fighterBreathe 2.6s ease-in-out infinite;
    animation-delay:0ms, var(--breathe-delay, 0ms);
  }
  .fighter-portrait.awakening-max::after{
    content:''; position:absolute; inset:0; border-radius:50%;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.4) 50%, transparent 70%);
    animation:awakeningShine 2.8s ease-in-out infinite;
    pointer-events:none; z-index:6;
  }

  .card-portrait{
    position:relative; aspect-ratio:1/1;
    background:linear-gradient(150deg, var(--surface-2), var(--surface-3));
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  /* Vignette cinématographique — bas du portrait */
  .card-portrait::after{
    content:''; position:absolute; bottom:0; left:0; right:0;
    height:52%; pointer-events:none; z-index:1;
    background:linear-gradient(to top, rgba(8,6,21,.65) 0%, transparent 100%);
  }
  .card-portrait-placeholder{
    font-family:var(--font-display); font-size:2.4rem; font-weight:700;
    color:var(--text-faint);
  }
  .card-rarity-badge{
    position:absolute; top:6px; right:6px; z-index:2;
    font-size:.58rem; font-weight:800; letter-spacing:.04em;
    padding:2px 7px; border-radius:999px; color:#3B2000;
    text-transform:uppercase;
  }
  .in-team-badge{
    position:absolute; bottom:6px; left:6px; z-index:2;
    background:var(--accent2); color:#fff;
    font-size:.55rem; font-weight:800; letter-spacing:.06em;
    padding:2px 7px; border-radius:999px;
  }
  .card-aura-badge{
    position:absolute; top:6px; left:6px; z-index:2;
    background:linear-gradient(90deg,#fbbf24,#f43f5e); color:#3B2000;
    font-size:.58rem; font-weight:800; letter-spacing:.02em;
    padding:2px 7px; border-radius:999px;
    box-shadow:0 0 8px rgba(251,191,36,.5);
  }
  .card-info{ padding:8px 9px 10px; }
  .card-name{
    font-weight:800; font-size:.86rem;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card-level{ font-size:.72rem; color:var(--text-dim); margin-top:1px; }
  .card-types{ display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .type-badge{
    font-size:.6rem; font-weight:700; color:#3B2000;
    padding:2px 6px; border-radius:6px; line-height:1.5;
    white-space:nowrap;
  }
  /* Rebelle (violet foncé) : texte noir illisible par défaut → blanc */
  .type-badge[style*="6a0dad"]{ color:#fff; }
  .card-awakening{
    color:var(--accent); font-size:.7rem; letter-spacing:.05em; margin-top:5px;
  }
  .xp-bar{
    height:3px; border-radius:2px; overflow:hidden;
    background:var(--surface-3); margin-top:6px;
  }
  .xp-bar-fill{
    height:100%; position:relative; overflow:hidden;
    background:linear-gradient(90deg, var(--rose-deep), var(--accent));
  }
  .xp-bar-fill::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    animation:barShimmer 2.5s ease-in-out infinite;
  }
  @keyframes barShimmer{
    0%{transform:translateX(-100%);} 100%{transform:translateX(250%);}
  }
  .card-stats-mini{
    display:grid; grid-template-columns:repeat(2,1fr); gap:2px 6px; margin-top:6px;
    font-size:.62rem; color:var(--text-dim); font-family:var(--font-mono);
  }
  .card-stats-mini span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Bonus de stats apportés par l'équipement (+XX vert / -WW rouge) */
  .stat-bonus-pos{ color:var(--success); font-weight:700; }
  .stat-bonus-neg{ color:var(--danger);  font-weight:700; }

  /* ============================================================
     ÉCRAN DE CONNEXION / INSCRIPTION
     ============================================================ */
  #auth-screen{
    position:fixed; inset:0; z-index:5000;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,178,85,.18), transparent 55%),
      radial-gradient(circle at 80% 80%, rgba(244,63,94,.14), transparent 55%),
      var(--bg, #150F09);
    padding:20px;
  }
  #auth-screen.hidden{ display:none; }
  .auth-box{
    width:100%; max-width:360px;
    background:rgba(20,14,34,.9); border:1px solid rgba(255,178,85,.25);
    border-radius:20px; padding:28px 24px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .auth-title{
    font-family:var(--font-display); text-align:center; margin:0 0 18px;
    font-size:1.6rem; letter-spacing:.03em;
    background:linear-gradient(90deg,#fbbf24,#f43f5e,#FFB255);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .auth-tabs{ display:flex; gap:6px; margin-bottom:18px; background:rgba(255,255,255,.04); border-radius:999px; padding:4px; }
  .auth-tab{
    flex:1; background:transparent; border:none; border-radius:999px;
    color:var(--text-dim); font-size:.82rem; font-weight:700; padding:8px 0; cursor:pointer;
    transition:background .18s, color .18s;
  }
  .auth-tab.active{ background:var(--accent, #FFB255); color:#3B2000; }
  #auth-form{ display:flex; flex-direction:column; gap:10px; }
  #auth-form input{
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
    border-radius:10px; padding:11px 14px; color:#fff; font-size:.88rem;
  }
  #auth-form input:focus{ outline:none; border-color:var(--accent, #FFB255); }
  .auth-error{
    background:rgba(244,63,94,.12); border:1px solid rgba(244,63,94,.4);
    color:#fca5b5; font-size:.76rem; border-radius:8px; padding:8px 10px;
  }
  .auth-submit-btn{
    background:linear-gradient(135deg,var(--accent2,#f43f5e),var(--accent2-deep,#be123c));
    border:none; border-radius:999px; color:#fff; font-weight:800;
    font-size:.9rem; padding:11px 0; cursor:pointer; margin-top:4px;
  }
  .auth-submit-btn:disabled{ opacity:.6; cursor:default; }
  .auth-hint{ text-align:center; font-size:.72rem; color:var(--text-faint); margin:14px 0 0; }

  /* ============================================================
     MODAL — character detail
     ============================================================ */
  #modal{ display:none; }
  .modal-backdrop{
    position:fixed; inset:0; z-index:600;
    background:rgba(5,3,14,.78); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    padding:18px;
  }

  /* ============================================================
     ÉVOLUTION — écran de révélation plein écran
     ============================================================ */
  .evolution-overlay{
    position:fixed; inset:0; z-index:700;
    background:radial-gradient(circle at 50% 40%, rgba(40,20,60,.96), rgba(5,3,10,.98));
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; cursor:pointer;
    opacity:0; pointer-events:none;
    transition:opacity .35s ease;
  }
  .evolution-overlay.visible{ opacity:1; pointer-events:auto; }

  .evolution-burst{
    position:absolute; top:50%; left:50%; width:120px; height:120px;
    transform:translate(-50%,-50%) scale(0); border-radius:50%;
    pointer-events:none;
  }
  .evolution-overlay.visible .evolution-burst{
    animation:evoBurst 1.6s ease-out forwards;
  }
  @keyframes evoBurst{
    0%{ transform:translate(-50%,-50%) scale(0); opacity:.9; }
    100%{ transform:translate(-50%,-50%) scale(6); opacity:0; }
  }

  .evolution-step{
    font-family:var(--font-mono); font-size:.78rem; color:var(--text-faint);
    letter-spacing:.1em; margin-bottom:10px; opacity:0;
  }
  .evolution-overlay.visible .evolution-step{ animation:evoFadeIn .4s ease .1s forwards; }

  .evolution-portrait-wrap{
    position:relative; width:clamp(150px, 42vw, 220px); height:clamp(150px, 42vw, 220px);
    border-radius:50%; margin-bottom:18px;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; border:4px solid var(--rc, var(--accent));
    transform:scale(.3) rotate(-15deg); opacity:0;
  }
  .evolution-overlay.visible .evolution-portrait-wrap{
    animation:evoPortraitIn .7s cubic-bezier(.2,1.4,.4,1) .05s forwards,
              evoPortraitGlow 1.8s ease-in-out 1s infinite;
  }
  .evolution-portrait-wrap.rarity-common    { --rc:var(--r-common); }
  .evolution-portrait-wrap.rarity-uncommon  { --rc:var(--r-uncommon); }
  .evolution-portrait-wrap.rarity-rare      { --rc:var(--r-rare); }
  .evolution-portrait-wrap.rarity-epic      { --rc:var(--r-epic); }
  .evolution-portrait-wrap.rarity-legendary { --rc:var(--r-legendary); }
  .evolution-portrait-wrap.rarity-mythic    { --rc:var(--r-mythic); }
  @keyframes evoPortraitIn{
    0%{ transform:scale(.3) rotate(-15deg); opacity:0; }
    55%{ transform:scale(1.18) rotate(6deg); opacity:1; }
    78%{ transform:scale(.94) rotate(-2deg); }
    100%{ transform:scale(1) rotate(0); opacity:1; }
  }
  @keyframes evoPortraitGlow{
    0%,100%{ box-shadow:0 0 18px 2px var(--rc, var(--accent)); }
    50%{ box-shadow:0 0 38px 10px var(--rc, var(--accent)); }
  }
  .evolution-portrait{ width:100%; height:100%; object-fit:cover; object-position:center 20%; }
  .evolution-portrait-ph{
    font-family:var(--font-display); font-weight:700; font-size:4rem; color:var(--text-faint);
  }

  .evolution-title{
    font-family:var(--font-display); font-weight:900; font-size:clamp(1.5rem, 7vw, 2.2rem);
    color:#fff; text-shadow:0 0 18px var(--accent), 0 0 6px rgba(255,255,255,.8);
    margin-bottom:10px; letter-spacing:.02em;
    transform:scale(0) rotate(-8deg); opacity:0;
  }
  .evolution-overlay.visible .evolution-title{
    animation:evoTitlePunch .6s cubic-bezier(.3,1.6,.4,1) .35s forwards;
  }
  @keyframes evoTitlePunch{
    0%{ transform:scale(0) rotate(-8deg); opacity:0; }
    55%{ transform:scale(1.35) rotate(4deg); opacity:1; }
    75%{ transform:scale(.92) rotate(-1deg); }
    100%{ transform:scale(1) rotate(0); opacity:1; }
  }

  .evolution-name{
    font-family:var(--font-display); font-weight:700; font-size:1.3rem;
    margin-bottom:8px; opacity:0;
  }
  .evolution-overlay.visible .evolution-name{ animation:evoFadeIn .4s ease .6s forwards; }

  .evolution-meta{
    display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
    margin-bottom:22px; opacity:0;
  }
  .evolution-overlay.visible .evolution-meta{ animation:evoFadeIn .4s ease .7s forwards; }
  .evolution-rarity-badge{
    font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    background:rgba(255,255,255,.08); border-radius:999px; padding:4px 12px;
  }

  .evolution-hint{
    font-size:.74rem; color:var(--text-faint); opacity:0;
    animation:none;
  }
  .evolution-overlay.visible .evolution-hint{ animation:evoFadeIn .4s ease .9s forwards, evoPulse 1.6s ease-in-out 1.3s infinite; }

  @keyframes evoFadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes evoPulse{ 0%,100%{ opacity:.5; } 50%{ opacity:1; } }

  /* ============================================================
     MONTÉE DE NIVEAU DU JOUEUR — écran de révélation plein écran
     ============================================================ */
  .player-levelup-overlay{
    position:fixed; inset:0; z-index:700;
    background:radial-gradient(circle at 50% 40%, rgba(60,45,10,.92), rgba(5,3,10,.98));
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; cursor:pointer;
    opacity:0; pointer-events:none;
    transition:opacity .35s ease;
  }
  .player-levelup-overlay.visible{ opacity:1; pointer-events:auto; }

  .lvlup-burst{
    position:absolute; top:50%; left:50%; width:120px; height:120px;
    transform:translate(-50%,-50%) scale(0); border-radius:50%;
    background:radial-gradient(circle, #f4c26755, transparent 70%);
    pointer-events:none;
  }
  .player-levelup-overlay.visible .lvlup-burst{
    animation:evoBurst 1.6s ease-out forwards;
  }

  .lvlup-badge-wrap{
    position:relative; width:clamp(130px, 36vw, 180px); height:clamp(130px, 36vw, 180px);
    border-radius:50%; margin-bottom:18px;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    border:4px solid #f4c267;
    transform:scale(.3) rotate(-15deg); opacity:0;
  }
  .player-levelup-overlay.visible .lvlup-badge-wrap{
    animation:evoPortraitIn .7s cubic-bezier(.2,1.4,.4,1) .05s forwards,
              lvlupBadgeGlow 1.8s ease-in-out 1s infinite;
  }
  @keyframes lvlupBadgeGlow{
    0%,100%{ box-shadow:0 0 18px 2px #f4c267; }
    50%{ box-shadow:0 0 38px 10px #f4c267; }
  }
  .lvlup-badge-level{
    font-family:var(--font-display); font-weight:900; font-size:clamp(2.2rem, 10vw, 3.2rem);
    color:#f4c267; text-shadow:0 0 14px rgba(244,194,103,.8);
  }

  .lvlup-title{
    font-family:var(--font-display); font-weight:900; font-size:clamp(1.5rem, 7vw, 2.2rem);
    color:#fff; text-shadow:0 0 18px #f4c267, 0 0 6px rgba(255,255,255,.8);
    margin-bottom:6px; letter-spacing:.02em;
    transform:scale(0) rotate(-8deg); opacity:0;
  }
  .player-levelup-overlay.visible .lvlup-title{
    animation:evoTitlePunch .6s cubic-bezier(.3,1.6,.4,1) .35s forwards;
  }

  .lvlup-name{
    font-family:var(--font-display); font-weight:700; font-size:1.3rem;
    margin-bottom:18px; opacity:0; color:var(--text);
  }
  .player-levelup-overlay.visible .lvlup-name{ animation:evoFadeIn .4s ease .6s forwards; }

  .lvlup-energy-line{
    font-family:var(--font-mono); font-size:.95rem; font-weight:700;
    color:var(--accent2); margin-bottom:6px; opacity:0;
  }
  .player-levelup-overlay.visible .lvlup-energy-line{ animation:evoFadeIn .4s ease .75s forwards; }
  .lvlup-energy-regen{ color:#4ade80; }
  .player-levelup-overlay.visible .lvlup-energy-regen{ animation:evoFadeIn .4s ease .9s forwards; }

  .lvlup-hint{
    font-size:.74rem; color:var(--text-faint); opacity:0; margin-top:14px;
  }
  .player-levelup-overlay.visible .lvlup-hint{ animation:evoFadeIn .4s ease 1.1s forwards, evoPulse 1.6s ease-in-out 1.5s infinite; }
  .modal-box{
    position:relative;
    background:linear-gradient(160deg, var(--surface) 0%, #201709 100%);
    border:1px solid rgba(255,255,255,.07);
    box-shadow:0 0 0 1px var(--border-soft), 0 20px 60px -12px rgba(0,0,0,.8),
               0 0 40px -20px var(--rose-glow);
    border-radius:var(--radius-lg);
    max-width:520px; width:100%;
    max-height:88vh; overflow-y:auto;
    padding:20px;
    animation:popIn .22s cubic-bezier(.34,1.28,.64,1);
  }
  @keyframes popIn{ from{opacity:0; transform:scale(.94) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);} }

  .modal-close{
    position:absolute; top:12px; right:12px; z-index:2;
    width:30px; height:30px; border-radius:50%;
    border:1px solid var(--border); background:var(--surface-2);
    color:var(--text-dim); font-size:.9rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s, color .15s, border-color .15s;
  }
  .modal-close:hover{ background:var(--rose-deep); color:#fff; border-color:var(--rose); }
  .detail-layout{ display:flex; gap:16px; flex-wrap:wrap; }
  .detail-portrait{
    width:140px; flex-shrink:0; position:relative;
    border-radius:var(--radius); overflow:hidden;
    background:linear-gradient(150deg, var(--surface-2), var(--surface-3));
    align-self:stretch; min-height:140px;
    display:flex; align-items:center; justify-content:center;
  }
  .detail-portrait img{
    position:absolute; top:0; left:0; max-width:none; max-height:none;
  }
  .detail-portrait-placeholder{
    font-family:var(--font-display); font-size:3.2rem; font-weight:700; color:var(--text-faint);
  }
  .detail-rarity{
    position:absolute; bottom:0; left:0; right:0;
    text-align:center; font-size:.7rem; font-weight:800;
    letter-spacing:.08em; text-transform:uppercase;
    padding:4px 0; color:#3B2000;
  }
  .detail-info{ flex:1; min-width:200px; }
  .detail-info h3{
    font-family:var(--font-display); margin:4px 0 6px; font-size:1.25rem;
  }
  .detail-desc{ color:var(--text-dim); font-size:.84rem; line-height:1.5; margin:0 0 10px; }
  .detail-types{ display:flex; gap:6px; margin-bottom:8px; }
  .detail-passives{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .detail-passive-item{
    background:var(--surface-2); border:1px solid var(--border-soft);
    border-radius:var(--radius-sm); padding:7px 10px;
  }
  .detail-passive-name{ display:block; font-weight:800; font-size:.8rem; color:var(--accent); }
  .detail-passive-desc{ display:block; font-size:.72rem; color:var(--text-dim); margin-top:2px; }

  /* Affinités de type (dégâts infligés / reçus) */
  .detail-affinities{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .affinity-section-title{ font-size:.72rem; font-weight:800; color:var(--text-dim); margin-bottom:4px; }
  .affinity-row{
    display:flex; align-items:center; gap:8px; padding:4px 0;
  }
  .affinity-mult{
    flex-shrink:0; width:42px; text-align:center; font-family:var(--font-mono);
    font-weight:900; font-size:.74rem; border-radius:6px; padding:2px 0;
  }
  .affinity-types{ display:flex; flex-wrap:wrap; gap:4px; }
  .type-badge-mini{
    display:inline-flex; align-items:center; gap:2px;
    font-size:.62rem; font-weight:700; color:#fff;
    padding:2px 6px; border-radius:999px;
  }
  /* Charme (blanc) et Mystique (cyan clair) : texte blanc illisible par défaut → noir */
  .type-badge-mini[style*="ffffff"], .type-badge-mini[style*="1affd9"]{ color:#3B2000; }
  .affinity-row.affinity-super .affinity-mult{ background:rgba(74,222,128,.22); color:#4ade80; }
  .affinity-row.affinity-good  .affinity-mult{ background:rgba(74,222,128,.14); color:#86efac; }
  .affinity-row.affinity-bad   .affinity-mult{ background:rgba(248,113,113,.14); color:#fca5a5; }
  .affinity-row.affinity-vbad  .affinity-mult{ background:rgba(248,113,113,.22); color:#f87171; }
  .affinity-row.affinity-immune .affinity-mult{ background:rgba(148,148,148,.2); color:#bbb; }

  /* Fiche de combattant (combat) : étiquette allié/ennemi + altérations actives */
  .detail-side-tag{
    font-size:.6rem; font-weight:800; padding:2px 7px; border-radius:999px;
    vertical-align:middle; margin-left:6px;
  }
  .detail-side-ally{ background:rgba(74,222,128,.2); color:#4ade80; }
  .detail-side-enemy{ background:rgba(248,113,113,.2); color:#f87171; }
  .detail-status-effects{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .status-badge-detail{
    font-size:.68rem; font-weight:700; background:var(--surface-2);
    border:1px solid var(--border-soft); border-radius:999px; padding:3px 9px;
  }
  .detail-level, .detail-awakening{ font-size:.82rem; color:var(--text-dim); margin:4px 0; }
  .detail-level strong, .detail-awakening{ color:var(--text); }
  .detail-awakening{ color:var(--accent); letter-spacing:.06em; }
  .stat-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin:12px 0;
  }
  .stat-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface-2); border-radius:var(--radius-sm);
    padding:6px 10px; font-size:.82rem;
  }
  .stat-row strong{ font-family:var(--font-mono); color:var(--accent); }
  .stat-aura-row{
    grid-column: 1 / -1;
    background:linear-gradient(90deg, rgba(251,191,36,.14), rgba(244,63,94,.10));
    border:1px solid rgba(251,191,36,.4);
  }
  .stat-aura-row span{ font-weight:700; }
  .stat-aura-row strong{ color:#fbbf24; font-size:.95rem; text-shadow:0 0 10px rgba(251,191,36,.5); }
  .detail-equip h4{ font-size:.85rem; margin:14px 0 8px; color:var(--text-dim); font-weight:700; }
  .equip-slots{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .equip-slot{
    background:var(--surface-2); border:1px dashed var(--border);
    border-radius:var(--radius-sm); padding:8px 6px;
    font-size:.7rem; text-align:center; min-height:54px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .equip-slot strong{ font-size:.72rem; }
  .empty-slot{ color:var(--text-faint); }
  .detail-evo{
    margin-top:12px; padding:10px 12px; background:var(--surface-2);
    border-radius:var(--radius-sm); font-size:.82rem; color:var(--text-dim);
    border-left:3px solid var(--accent2);
  }
  .detail-evo strong{ color:var(--text); }
  .detail-char-history{
    margin-top:10px; padding:10px 12px; background:var(--surface-2);
    border-radius:var(--radius-sm); display:flex; flex-direction:column; gap:6px;
    border-left:3px solid var(--accent);
  }
  .detail-history-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:.8rem; color:var(--text-dim);
  }
  .detail-history-row strong{ color:var(--text); font-weight:700; }

  /* ============================================================
     TEAM SCREEN
     ============================================================ */
  .team-slots{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(172px,1fr));
    gap:10px; margin-bottom:22px;
  }
  .team-slot{
    background:var(--surface);
    border:1.5px dashed var(--border);
    border-radius:var(--radius);
    min-height:104px;
  }
  .team-slot.filled{ border-style:solid; border-color:var(--border-soft); }
  .team-member-card{
    display:flex; align-items:flex-start; gap:8px; padding:10px; position:relative; height:100%;
  }
  .team-portrait, .portrait-ph{
    width:46px; height:46px; border-radius:var(--radius-sm);
    background:var(--surface-2); flex-shrink:0; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; color:var(--text-faint);
    position:relative;
  }
  .team-portrait img{ width:100%; height:100%; object-fit:cover; object-position:center 20%; }
  .team-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .team-name{ font-weight:800; font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .team-level{ font-size:.72rem; color:var(--text-dim); }
  .team-types{ display:flex; flex-wrap:wrap; gap:4px; }
  .team-stats-mini{
    display:flex; flex-wrap:wrap; gap:6px; margin-top:1px;
    font-size:.6rem; color:var(--text-dim); font-family:var(--font-mono);
  }
  .btn-remove-team{
    width:24px; height:24px; border-radius:50%; flex-shrink:0;
    border:none; background:var(--danger); color:#fff;
    font-size:.7rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .empty-slot-label{
    display:flex; align-items:center; justify-content:center;
    height:100%; color:var(--text-faint); font-size:.78rem; font-weight:600;
  }

     COMBAT
     ============================================================ */

    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;
  }
  .combat-mode-btn{
    flex:1 1 calc(50% - 4px); min-width:130px; background:var(--surface); border:1px solid var(--border-soft);
    border-radius:999px; padding:9px 10px; cursor:pointer;
    font-family:var(--font-body); font-weight:700; font-size:.74rem;
    color:var(--text-dim); transition:border-color .15s ease, color .15s ease, background .15s ease;
    display:flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap;

  .combat-mode-btn:hover{ border-color:var(--accent2); color:var(--text); }
  .combat-mode-btn.active{
    border-color:var(--accent2); background:rgba(255,174,77,.15); color:var(--accent2);
  }
  .energy-cost-badge{
    background:rgba(96,165,250,.18); color:#60A5FA; border-radius:999px;
    padding:1px 7px; font-size:.68rem; font-weight:800; font-family:var(--font-mono);
  }
  .combat-mode-note{
    font-size:.74rem; color:var(--accent2); background:rgba(255,174,77,.1);
    border-radius:var(--radius-sm); padding:8px 10px; margin:0 0 10px;
  }
  .arena-type-icon{
    width:48px; height:48px; border-radius:50%; margin:0 auto 8px;
    display:flex; align-items:center; justify-content:center; font-size:1.4rem;
  }
  .combat-lobby{ display:flex; flex-direction:column; gap:14px; }
  .team-preview h3{
    font-family:var(--font-display); font-size:.95rem; margin:0 0 8px; color:var(--text-dim);
  }
  .lobby-team{ display:flex; flex-wrap:wrap; gap:8px; }
  .lobby-member{
    background:var(--surface); border:1px solid var(--border-soft);
    border-radius:var(--radius); padding:10px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    min-width:104px; text-align:center; font-size:.78rem;
  }
  .lobby-portrait{
    width:46px; height:46px; border-radius:var(--radius-sm);
    background:var(--surface-2); display:flex; align-items:center; justify-content:center;
    overflow:hidden; font-family:var(--font-display); font-weight:700; font-size:1.1rem;
    position:relative;
  }
  .lobby-portrait img{ width:100%; height:100%; object-fit:cover; object-position:center 20%; }

  .combat-line-title{
    font-family:var(--font-display); font-size:.95rem; margin:4px 0 10px; color:var(--text-dim);
  }
  /* ── Mode Odyssée ── */
  .story-header{ text-align:center; padding:10px 0 14px; }
  .story-world-title{ font-family:var(--font-display); font-size:1.2rem; font-weight:700; margin-bottom:4px; }
  .story-world-bonus{ font-size:.72rem; color:#f59e0b; font-weight:700; margin-bottom:8px; }
  .story-progress-bar-wrap{
    height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden;
    margin:0 auto 4px; max-width:300px;
  }
  .story-progress-bar{ height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:4px; transition:width .4s ease; }
  .story-progress-label{ font-size:.72rem; color:var(--text-dim); }
  .story-sub-grid{
    display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:10px 0;
  }
  .story-sub-cell{
    border-radius:var(--radius-sm); padding:8px 4px; text-align:center;
    border:1.5px solid var(--border-soft); background:var(--surface);
    position:relative; min-height:56px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px;
    transition:border-color .15s ease;
  }
  .story-sub-number{ font-size:.75rem; font-family:var(--font-mono); font-weight:700; color:var(--text-dim); }
  .story-sub-badge{ font-size:.55rem; font-weight:800; letter-spacing:.03em; text-transform:uppercase; }
  .story-sub-done{ font-size:1rem; color:var(--success, #4ade80); }
  .story-sub-reward{ font-size:.6rem; font-weight:800; letter-spacing:.02em; margin-top:1px; line-height:1.2; }
  .story-sub-reward-elite{ color:#fbbf24; }
  .story-sub-reward-boss { color:#FFD08A; }
  .story-done{ border-color:var(--success,#4ade80); background:rgba(74,222,128,.07); }
  .story-done .story-sub-number{ color:var(--success,#4ade80); }
  .story-active{ border-color:var(--accent2); background:rgba(255,174,77,.15);
    box-shadow:0 0 10px rgba(255,174,77,.3); }
  .story-active .story-sub-number{ color:var(--accent2); }
  .story-locked{ opacity:.45; }
  /* Elite */
  .story-elite-cell{ border-color:#FFB255; background:rgba(255,178,85,.08); }
  .story-elite-cell .story-sub-badge{ color:#FFB255; }
  .story-elite-cell.story-done{ border-color:#FFB255; }
  /* Boss */
  .story-boss-cell{ border-color:#f87171; background:rgba(248,113,113,.1); }
  .story-boss-cell .story-sub-badge{ color:#f87171; }
  .story-boss-cell.story-done{ border-color:#f87171; }
  /* Boutons spéciaux */
  .story-elite-btn{ background:linear-gradient(135deg,#E8850F,#FFB255) !important; }
  .story-boss-btn{ background:linear-gradient(135deg,#991b1b,#f87171) !important; }
  /* Légende */
  .story-legend{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:4px 0 10px; }
  .story-legend-item{ font-size:.68rem; font-weight:700; opacity:.75; }
  .story-elite-legend{ color:#FFB255; }
  .story-boss-legend{ color:#f87171; }

  .evo-line-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px;
  }
  .evo-line-card{
    background:var(--surface); border:1.5px solid var(--border-soft);
    border-radius:var(--radius); padding:10px; cursor:pointer; text-align:center;
    transition:border-color .15s ease, transform .15s ease;
    position:relative;
  }
  .evo-line-card:hover:not(.locked){ transform:translateY(-2px); border-color:var(--accent2); }
  .evo-line-card.selected{ border-color:var(--accent); background:rgba(244,194,103,.08); }
  .evo-line-card.locked{ cursor:default; opacity:0.75; border-style:dashed; }
  .evo-line-chain{
    display:flex; align-items:center; justify-content:center; gap:3px; margin-bottom:8px;
  }
  .evo-line-portrait{
    width:54px; height:54px; border-radius:50%; flex-shrink:0; margin:0 auto 8px;
    background:var(--surface-2); overflow:hidden; position:relative;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:.85rem; color:var(--text-faint);
  }
  .evo-line-portrait img{ width:100%; height:100%; object-fit:cover; object-position:center 20%; }
  .locked-portrait{ border:1.5px dashed #444; }
  .lock-overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:1.4rem; background:rgba(0,0,0,.35); border-radius:50%;
  }
  .lock-badge{
    position:absolute; top:6px; right:6px; font-size:.9rem;
  }
  .evo-arrow{ color:var(--text-faint); font-size:.75rem; }
  .evo-line-name{ font-weight:800; font-size:.84rem; }
  .evo-line-meta{
    display:flex; align-items:center; justify-content:center; gap:6px; margin-top:5px; flex-wrap:wrap;
  }
  .evo-line-count{ font-size:.62rem; color:var(--text-faint); font-family:var(--font-mono); }
  .combat-line-subtitle{
    text-align:center; color:var(--text-faint); font-size:.78rem; margin:-6px 0 12px; line-height:1.5;
  }
  .arena-progress-bar{
    height:4px; background:var(--border-soft); border-radius:2px; margin-top:7px; overflow:hidden;
  }
  .arena-progress-fill{ height:100%; border-radius:2px; transition:width .3s ease; }

  .btn-primary{
    font-family:var(--font-display); font-weight:700; letter-spacing:.03em;
    background:linear-gradient(135deg, var(--rose), var(--accent2), var(--rose-deep));
    background-size:200% auto;
    color:#fff; border:none; border-radius:999px;
    padding:13px 22px; cursor:pointer; font-size:.92rem;
    box-shadow:0 6px 20px -8px var(--rose), 0 0 0 1px rgba(255,255,255,.08) inset;
    transition:transform .12s ease, box-shadow .12s ease, background-position .4s ease;
  }
  .btn-primary:hover{ background-position:right center; }
  .btn-primary:active{ transform:translateY(1px) scale(.99); }
  .btn-launch-combat{ width:100%; }

  .trophy-hud{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--radius); padding:8px 14px; margin-bottom:10px;
    font-family:var(--font-display); font-size:.85rem; color:var(--text);
  }
  .trophy-hud-score strong{ color:var(--accent); font-size:1rem; }
  .trophy-hud-rounds strong{ color:var(--accent2); }
  .battle-scene{ display:flex; flex-direction:column; gap:2px; margin-bottom:14px; position:relative; }
  .battle-side h3{
    font-size:.75rem; text-transform:uppercase; letter-spacing:.12em;
    color:var(--text-faint); margin:0 0 8px; font-weight:700;
  }
  .battle-side.battle-enemy h3{ color:var(--danger); }
  .battle-side.battle-player h3{ color:var(--success); }
  .battle-vs{
    align-self:center; width:34px; height:34px; border-radius:50%;
    background:radial-gradient(circle, var(--surface-2), var(--surface));
    border:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:.95rem; color:var(--accent); margin:6px 0;
    box-shadow:0 0 14px -2px rgba(244,194,103,.55);
  }
  .battle-fighters{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }

  .fighter-card{
    background:var(--surface); border:1.5px solid color-mix(in srgb, var(--rc, var(--border-soft)) 40%, transparent);
    border-top:3px solid var(--rc, var(--border));
    border-radius:var(--radius); padding:12px 8px 10px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    min-width:108px; max-width:172px; flex:1 1 116px;
    position:relative; overflow:visible;
    transition:opacity .3s ease, filter .3s ease;
    animation:fighterEnter .45s ease both;
    animation-delay:var(--enter-delay, 0ms);
  }
  /* Fond teinté rareté 80-85% */
  .fighter-card::before{
    content:''; position:absolute; inset:0; border-radius:var(--radius);
    background:linear-gradient(160deg,
      color-mix(in srgb, var(--rc, transparent) 80%, transparent) 0%,
      color-mix(in srgb, var(--rc, transparent) 85%, transparent) 100%);
    opacity:0.18; pointer-events:none; z-index:0;
  }
  .fighter-card.rarity-legendary::before{ opacity:0.26; }
  .fighter-card.rarity-mythic::before   { opacity:0.30; }
  .fighter-card > *{ position:relative; z-index:1; }
  /* Le portrait doit toujours être visible par-dessus les éléments voisins.
     On sort le portrait du stacking context de la carte via un z-index élevé,
     combiné à overflow:visible sur la carte parente (déjà défini). */
  .fighter-card .fighter-portrait{
    z-index:3;
    /* Isolation : s'assurer que la carte ne crée pas un stacking context isolé
       (transform déclencherait un contexte isolé) */
  }
  /* Élever la carte active pour que son portrait passe devant les voisines */
  .fighter-card:focus-within,
  .fighter-card.active-turn{ z-index:4; }
  /* Le portrait doit passer AU-DESSUS des cartes adjacentes lors des animations */
  .fighter-card .fighter-portrait{ z-index:2; }
  .fighter-card.rarity-common    { --rc:var(--r-common); }
  .fighter-card.rarity-uncommon  { --rc:var(--r-uncommon); }
  .fighter-card.rarity-rare      { --rc:var(--r-rare); }
  .fighter-card.rarity-epic      { --rc:var(--r-epic); }
  .fighter-card.rarity-legendary { --rc:var(--r-legendary); }
  .fighter-card.rarity-mythic    { --rc:var(--r-mythic); }
  .fighter-card.defeated{ opacity:.4; filter:grayscale(1); }

  .fighter-portrait{
    width:74px; height:74px; border-radius:50%; flex-shrink:0;
    background:var(--surface-2); overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:1.5rem; color:var(--text-faint);
    border:2px solid var(--rc, var(--border));
    box-shadow:0 0 0 3px rgba(0,0,0,.25), 0 4px 14px -4px var(--rc, transparent);
    position:relative;
    animation:fighterBreathe 2.6s ease-in-out infinite;
    animation-delay:var(--breathe-delay, 0ms);
  }
  .fighter-card.defeated .fighter-portrait{ animation:none; }

  /* ============================================================
     PASSIFS EN COMBAT — bannière de nom + petites animations
     ============================================================ */
  /* ── Icônes d'altérations persistantes (coin supérieur droit du portrait) ── */
  .status-icons{
    position:absolute; top:-6px; right:-6px; z-index:20;
    display:flex; flex-direction:column; align-items:flex-end; gap:2px;
    pointer-events:none;
  }
  .status-icon{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:18px; height:18px; padding:0 3px;
    border-radius:4px; font-size:.58rem; font-weight:800;
    color:#fff; line-height:1;
    box-shadow:0 1px 4px rgba(0,0,0,.5);
    white-space:nowrap;
  }
  .status-buff{ background:linear-gradient(135deg,#16a34a,#4ade80); }
  .status-pulse{ animation:statusPulse 1.1s ease-in-out infinite alternate; }
  @keyframes statusPulse{
    from{ opacity:.75; transform:scale(1);   }
    to  { opacity:1;   transform:scale(1.12); }
  }

  .passive-banner{
    position:absolute; top:-10px; left:50%; transform:translateX(-50%);
    background:linear-gradient(135deg, var(--accent2), var(--accent2-deep));
    color:#fff; font-weight:800; font-size:.6rem; font-family:var(--font-display);
    padding:3px 8px; border-radius:999px; white-space:nowrap;
    z-index:20; pointer-events:none; box-shadow:0 2px 8px -2px rgba(0,0,0,.5);
    animation:passiveBannerFloat 1.4s ease-out forwards;
  }
  @keyframes passiveBannerFloat{
    0%   { opacity:0; transform:translate(-50%, 6px) scale(.7); }
    15%  { opacity:1; transform:translate(-50%, -4px) scale(1.05); }
    25%  { transform:translate(-50%, -4px) scale(1); }
    80%  { opacity:1; transform:translate(-50%, -14px) scale(1); }
    100% { opacity:0; transform:translate(-50%, -22px) scale(.9); }
  }

  /* Grande bannière centrale : nettement plus visible que le petit repère
     ci-dessus, mise en file (jamais 2 superposées) côté JS. */
  .passive-banner-big{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.6);
    background:linear-gradient(135deg, var(--accent2), var(--accent2-deep));
    color:#fff; font-weight:900; font-size:1.05rem; font-family:var(--font-display);
    padding:11px 24px; border-radius:999px; white-space:nowrap;
    z-index:60; pointer-events:none; letter-spacing:.02em;
    box-shadow:0 0 0 2px rgba(255,255,255,.3), 0 10px 28px -6px rgba(0,0,0,.7), 0 0 32px -2px var(--accent2);
    animation:passiveBannerBigPop 1.5s cubic-bezier(.22,1.4,.4,1) forwards;
  }
  .passive-banner-big-icon{ margin-right:6px; }
  @keyframes passiveBannerBigPop{
    0%   { opacity:0;   transform:translate(-50%,-50%) scale(.35) rotate(-4deg); }
    14%  { opacity:1;   transform:translate(-50%,-50%) scale(1.18) rotate(2deg); }
    24%  { opacity:1;   transform:translate(-50%,-50%) scale(1) rotate(0deg); }
    78%  { opacity:1;   transform:translate(-50%,-50%) scale(1) rotate(0deg); }
    100% { opacity:0;   transform:translate(-50%,-62%) scale(.92) rotate(0deg); }
  }
  @media (max-width:380px){
    .passive-banner-big{ font-size:.88rem; padding:9px 18px; }
  }

  .passive-fx{ position:absolute; inset:0; pointer-events:none; z-index:15; border-radius:50%; }

  /* Petit brillant synchronisé PILE avec l'affichage du chiffre de dégâts/soin
     (contrairement à .passive-fx-* ci-dessous, qui se joue ~1s AVANT le chiffre) */
  .impact-glow{
    position:absolute; inset:0; pointer-events:none; z-index:14; border-radius:50%;
    animation:impactGlow 1.76s ease-out forwards;
  }
  @keyframes impactGlow{
    0%   { opacity:0;  box-shadow:0 0 0px 0px var(--glow-color, #4ade80); }
    12%  { opacity:1;  box-shadow:0 0 22px 6px var(--glow-color, #4ade80); }
    70%  { opacity:1;  box-shadow:0 0 14px 3px var(--glow-color, #4ade80); }
    100% { opacity:0;  box-shadow:0 0 0px 0px var(--glow-color, #4ade80); }
  }
  .impact-glow-heal{ --glow-color:#4ade80; } /* vert — Régénération */
  .impact-glow-dmg { --glow-color:#60A5FA; } /* bleu — Tsunami */

  /* Fanatisme : vague de dégâts (façon "tsunami") balayant la cible */
  .passive-fx-wave{
    background:radial-gradient(circle, rgba(244,194,103,.55), transparent 70%);
    animation:passiveWave .8s ease-out forwards;
  }
  @keyframes passiveWave{
    0%   { opacity:0; transform:scale(.6); }
    40%  { opacity:1; transform:scale(1.15); }
    100% { opacity:0; transform:scale(1.4); }
  }

  /* Régénération : étincelles vertes montantes */
  .passive-fx-heal{
    background:radial-gradient(circle, rgba(74,222,128,.55), transparent 70%);
    animation:passiveHeal .9s ease-out forwards;
  }
  @keyframes passiveHeal{
    0%   { opacity:0; transform:scale(.7) translateY(6px); }
    50%  { opacity:1; transform:scale(1.05) translateY(-4px); }
    100% { opacity:0; transform:scale(1) translateY(-12px); }
  }

  /* Ardente : montée d'énergie orangée */
  .passive-fx-buff{
    background:linear-gradient(0deg, rgba(255,91,91,.5), transparent 80%);
    animation:passiveBuff .8s ease-out forwards;
  }
  @keyframes passiveBuff{
    0%   { opacity:0; transform:scaleY(.5); }
    50%  { opacity:1; transform:scaleY(1); }
    100% { opacity:0; transform:scaleY(1.1); }
  }

  /* Garde Robe : éclat blanc balayant (purge) */
  .passive-fx-cleanse{
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.65) 50%, transparent 70%);
    animation:passiveCleanse .7s ease-out forwards;
  }
  @keyframes passiveCleanse{
    0%   { opacity:0; transform:translateX(-60%); }
    50%  { opacity:1; }
    100% { opacity:0; transform:translateX(60%); }
  }

  /* Contre-Attaque : flash rouge vif et bref */
  .passive-fx-counter{
    background:rgba(240,97,122,.55);
    animation:passiveFlash .4s ease-out forwards;
  }
  @keyframes passiveFlash{
    0%{ opacity:0; } 30%{ opacity:1; } 100%{ opacity:0; }
  }

  /* Mystère : halo violet tournant (vol de passif) */
  .passive-fx-steal{
    background:conic-gradient(from 0deg, rgba(255,174,77,.55), transparent 60%);
    animation:passiveSteal 1s ease-out forwards;
  }
  @keyframes passiveSteal{
    0%   { opacity:0; transform:rotate(0deg) scale(.8); }
    50%  { opacity:1; }
    100% { opacity:0; transform:rotate(180deg) scale(1.1); }
  }

  /* Statuts appliqués : paralysie (jaune), poison (violet), charme (rose) */
  .passive-fx-paralysis{ background:rgba(255,224,0,.45); animation:passiveFlash .5s ease-out forwards; }
  .passive-fx-poison{    background:rgba(122,108,255,.4); animation:passiveWave .7s ease-out forwards; }
  .passive-fx-charm{     background:rgba(255,143,196,.45); animation:passiveHeal .7s ease-out forwards; }

  /* Adorable (Charme) : scintillement argenté + contour perlé qui pulse */
  .passive-fx-adorable{
    background:radial-gradient(circle, rgba(220,230,255,.65) 0%, transparent 70%);
    box-shadow:0 0 0 3px rgba(200,220,255,.5);
    animation:passiveAdorable .9s ease-out forwards;
  }
  @keyframes passiveAdorable{
    0%   { opacity:0; transform:scale(.8); box-shadow:0 0 0 0px rgba(200,220,255,.6); }
    40%  { opacity:1; transform:scale(1.08); box-shadow:0 0 0 8px rgba(200,220,255,.0); }
    100% { opacity:0; transform:scale(1.15); }
  }

  /* Scénique (Idole) : explosion dorée + rayons partant du centre */
  .passive-fx-scenique{
    background:radial-gradient(circle, rgba(255,215,0,.7) 0%, rgba(255,165,0,.3) 45%, transparent 70%);
    animation:passiveScentique .85s ease-out forwards;
  }
  @keyframes passiveScentique{
    0%   { opacity:0; transform:scale(.5) rotate(-15deg); }
    35%  { opacity:1; transform:scale(1.2) rotate(0deg); }
    70%  { opacity:.6; transform:scale(1.05); }
    100% { opacity:0; transform:scale(1.25); }
  }

  .fighter-types{ display:flex; gap:4px; margin-top:-4px; }
  .type-chip{
    width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:.68rem; box-shadow:0 0 0 2px var(--surface);
  }
  /* Rebelle (violet foncé) : texte noir illisible par défaut → blanc */
  .type-chip[style*="6a0dad"]{ color:#fff; }

  .fighter-info{ width:100%; text-align:center; }
  .fighter-name{ font-size:.78rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fighter-name small{ color:var(--text-faint); font-weight:500; }
  .hp-bar{
    height:6px; border-radius:3px; overflow:hidden; background:var(--surface-3);
    margin:5px 0 3px;
  }
  .hp-bar-fill{ height:100%; transition:width .35s ease, background .35s ease; }
  .hp-text{ font-size:.65rem; color:var(--text-dim); font-family:var(--font-mono); }

  /* ── Entrée en scène ── */
  @keyframes fighterEnter{
    from{ opacity:0; transform:translateY(14px) scale(.9); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* ── Respiration au repos (combat plus vivant) ── */
  @keyframes fighterBreathe{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.035); }
  }

  /* ── Élan d'attaque (sur le portrait, indépendant de la carte) ── */
  @keyframes lungeUp{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-18px) scale(1.08); }
  }
  @keyframes lungeDown{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(18px) scale(1.08); }
  }
  .fighter-portrait.lunge-up{ animation:lungeUp .26s ease; z-index:3; }
  .fighter-portrait.lunge-down{ animation:lungeDown .26s ease; z-index:3; }

  /* ── Impact ── */
  @keyframes hitFlash{
    0%{ filter:brightness(1) saturate(1); }
    25%{ filter:brightness(2.2) saturate(0) drop-shadow(0 0 14px #fff); }
    100%{ filter:brightness(1) saturate(1); }
  }
  .fighter-portrait.hit-flash{ animation:hitFlash .45s ease; }
  @keyframes shakeHit{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px) rotate(-3deg); }
    50%{ transform:translateX(6px) rotate(3deg); }
    75%{ transform:translateX(-4px) rotate(-2deg); }
  }
  @keyframes shakeBig{
    0%,100%{ transform:translateX(0) translateY(0); }
    15%{ transform:translateX(-10px) translateY(-2px) rotate(-6deg); }
    35%{ transform:translateX(10px) translateY(2px) rotate(6deg); }
    55%{ transform:translateX(-8px) rotate(-4deg); }
    75%{ transform:translateX(8px) rotate(4deg); }
    90%{ transform:translateX(-3px); }
  }
  .fighter-portrait.shake-hit{ animation:shakeHit .35s ease; }
  .fighter-portrait.shake-big{ animation:shakeBig .48s ease; }

  /* ── Montée de niveau ── */
  @keyframes levelUpFlash{
    0%{ filter:brightness(1) saturate(1); box-shadow:0 0 0 0 rgba(255,221,128,0); }
    30%{ filter:brightness(1.9) saturate(1.3); box-shadow:0 0 24px 6px rgba(255,221,128,.9); }
    100%{ filter:brightness(1) saturate(1); box-shadow:0 0 0 0 rgba(255,221,128,0); }
  }
  .fighter-portrait.level-up-flash{ animation:levelUpFlash 1s ease; z-index:4; }

  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-4px); }
    40%{ transform:translateX(4px); }
    60%{ transform:translateX(-3px); }
    80%{ transform:translateX(3px); }
  }

  /* ── Textes flottants de combat ── */
  .float-text{
    position:absolute; top:0; left:50%; transform:translate(-50%, 0);
    white-space:nowrap; pointer-events:none; z-index:10;
    font-family:var(--font-display); font-weight:800; letter-spacing:.02em;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
    animation:floatUp 1.1s ease forwards;
    top:calc(0px - (var(--stack, 0) * 20px));
  }
  @keyframes floatUp{
    0%{ opacity:0; transform:translate(-50%, 6px) scale(.85); }
    15%{ opacity:1; transform:translate(-50%, -8px) scale(1.05); }
    75%{ opacity:1; transform:translate(-50%, -34px) scale(1); }
    100%{ opacity:0; transform:translate(-50%, -46px) scale(.95); }
  }
  .float-dmg{ font-size:2.1rem; color:#fff; animation-duration:1.76s; }
  .float-crit-dmg{ font-size:2.6rem; color:var(--accent); animation-duration:1.76s; }
  .float-crit-label{ font-size:1.36rem; color:var(--accent); animation-duration:1.76s; }
  .float-evade{ font-size:.8rem; color:var(--text-dim); }
  .float-levelup{ font-size:1.05rem; color:#ffd780; }
  .float-evolved{ font-size:.85rem; color:#FFB255; }
  .float-mult{ font-size:1.4rem; font-family:var(--font-mono); font-weight:700; animation-duration:1.76s; }
  .float-mult-super{ color:#4ade80; }
  .float-mult-low{ color:#f87171; }
  .float-mult-immune{ color:#9ca3af; }
  .float-passive{ font-size:.72rem; color:#FFC066; letter-spacing:.04em; }
  /* Chiffres flottants colorés pour les PV modifiés par passif */
  .float-passive-heal  { font-size:1.9rem; color:#4ade80; font-weight:900; animation-duration:1.76s; } /* vert  — Régénération */
  .float-passive-dmg   { font-size:1.9rem; color:#f87171; font-weight:900; animation-duration:1.76s; } /* rouge — Fanatisme, Contre-Attaque */
  .float-passive-poison{ font-size:1.9rem; color:#FFA733; font-weight:900; animation-duration:1.76s; } /* violet — Poison */
  @keyframes poisonTickFlash{
    0%  { filter:brightness(1) saturate(1); }
    25% { filter:brightness(.65) saturate(3) hue-rotate(210deg); box-shadow:0 0 20px rgba(168,85,247,.95),0 0 40px rgba(168,85,247,.4); }
    65% { filter:brightness(.8) saturate(2) hue-rotate(190deg); box-shadow:0 0 10px rgba(168,85,247,.5); }
    100%{ filter:brightness(1) saturate(1); box-shadow:none; }
  }
  .fighter-portrait.poison-tick-flash{
    animation:poisonTickFlash 600ms ease forwards !important;
  }

  .turn-order-bar{

  /* ── Victoire ── */
